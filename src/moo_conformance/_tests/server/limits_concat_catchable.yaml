              r = {@r, i};
            endfor
            return length(r);
          except e (ANY)
            return {"raised", e[1]};
          endtry
        as: wizard
        expect:
          value: ["raised", "E_QUOTA"]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

