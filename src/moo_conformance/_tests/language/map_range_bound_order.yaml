name: map_range_bound_order
description: >
  Map range read and range assignment order their checks as ToastStunt does
  (execute.cc OP_RANGE_REF and EOP_RANGESET). A read first raises E_TYPE when
  either bound is a list or map, then compares the two bounds with compare()
  (utils.cc), which orders values of different types by type: INT < OBJ < ERR
  < FLOAT < BOOL < STR. When from sorts after to the result is the empty map,
  whether or not the keys exist; otherwise a missing key raises E_RANGE. A
  range assignment first raises E_TYPE when the value is not a map, then when
  either bound is a list or map, then E_RANGE when either key is missing.

requires:
  builtins:
    - toliteral

tests:
  # Read: bounds of different types, neither key present. The rows go through
  # the six bound types in compare() order; a from of a later type than to
  # gives [], an earlier type raises E_RANGE.
  - name: map_range_read_from_int_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m[1..#1] ! ANY', `m[1..E_PERM] ! ANY', `m[1..1.5] ! ANY', `m[1..true] ! ANY', `m[1.."a"] ! ANY'};
    expect:
      value: [E_RANGE, E_RANGE, E_RANGE, E_RANGE, E_RANGE]

  - name: map_range_read_from_obj_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m[#1..1] ! ANY', `m[#1..E_PERM] ! ANY', `m[#1..1.5] ! ANY', `m[#1..true] ! ANY', `m[#1.."a"] ! ANY'};
    expect:
      value: [{}, E_RANGE, E_RANGE, E_RANGE, E_RANGE]

  - name: map_range_read_from_err_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m[E_PERM..1] ! ANY', `m[E_PERM..#1] ! ANY', `m[E_PERM..1.5] ! ANY', `m[E_PERM..true] ! ANY', `m[E_PERM.."a"] ! ANY'};
    expect:
      value: [{}, {}, E_RANGE, E_RANGE, E_RANGE]

  - name: map_range_read_from_float_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m[1.5..1] ! ANY', `m[1.5..#1] ! ANY', `m[1.5..E_PERM] ! ANY', `m[1.5..true] ! ANY', `m[1.5.."a"] ! ANY'};
    expect:
      value: [{}, {}, {}, E_RANGE, E_RANGE]

  - name: map_range_read_from_bool_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m[true..1] ! ANY', `m[true..#1] ! ANY', `m[true..E_PERM] ! ANY', `m[true..1.5] ! ANY', `m[true.."a"] ! ANY'};
    expect:
      value: [{}, {}, {}, {}, E_RANGE]

  - name: map_range_read_from_str_mixed_to
    statement: |
      m = ["q" -> 0];
      return {`m["a"..1] ! ANY', `m["a"..#1] ! ANY', `m["a"..E_PERM] ! ANY', `m["a"..1.5] ! ANY', `m["a"..true] ! ANY'};
    expect:
      value: [{}, {}, {}, {}, {}]

  # The issue's examples: one bound present, the other missing.
  - name: map_range_read_mixed_one_key_present
    statement: |
      m = ["a" -> 1];
      return {`m["a"..1] ! ANY', `m["z"..1] ! ANY', `m["a"..#1] ! ANY', `[0.5 -> 1]["b"..1] ! ANY', `m[1.."a"] ! ANY'};
    expect:
      value: [{}, {}, {}, {}, E_RANGE]

  # Read: every key present, bounds of different types in both directions.
  - name: map_range_read_mixed_keys_present
    statement: |
      m = [1 -> "i", #1 -> "o", E_PERM -> "e", 1.5 -> "f", true -> "b", "a" -> "s"];
      return {toliteral(m[#1..true]), toliteral(m[1.."a"]), toliteral(m[E_PERM..1.5]), toliteral(m["a"..1]), toliteral(m[true..#1])};
    expect:
      value: ['[#1 -> "o", E_PERM -> "e", 1.5 -> "f", true -> "b"]', '[1 -> "i", #1 -> "o", E_PERM -> "e", 1.5 -> "f", true -> "b", "a" -> "s"]', '[E_PERM -> "e", 1.5 -> "f"]', '[]', '[]']

  # Read: same-type bounds with from after to and keys missing give [].
  - name: map_range_read_same_type_inverted_missing_keys
    statement: |
      return {`["a" -> 1]["z".."b"] ! ANY', `[1.5 -> 1][2.5..0.5] ! ANY', `[#1 -> 1][#5..#2] ! ANY', `[E_PERM -> 1][E_RANGE..E_TYPE] ! ANY', `["x" -> 1][true..false] ! ANY', `["x" -> 1][5..2] ! ANY'};
    expect:
      value: [{}, {}, {}, {}, {}, {}]

  - name: map_range_read_same_type_ascending_missing_keys
    statement: |
      return {`["a" -> 1]["b".."z"] ! ANY', `[1.5 -> 1][0.5..2.5] ! ANY', `[#1 -> 1][#2..#5] ! ANY', `[E_PERM -> 1][E_TYPE..E_RANGE] ! ANY', `["x" -> 1][false..true] ! ANY', `["x" -> 1][2..5] ! ANY'};
    expect:
      value: [E_RANGE, E_RANGE, E_RANGE, E_RANGE, E_RANGE, E_RANGE]

  - name: map_range_read_empty_map
    statement: |
      return {`[]["b".."a"] ! ANY', `[]["a".."b"] ! ANY', `[][2..1] ! ANY', `[][1..1] ! ANY', `[][#1..1] ! ANY', `[][1..#1] ! ANY'};
    expect:
      value: [{}, E_RANGE, {}, E_RANGE, {}, E_RANGE]

  - name: map_range_read_equal_bounds
    statement: |
      m = ["a" -> 1];
      return {toliteral(m["a".."a"]), toliteral(m["A".."A"]), `m["b".."b"] ! ANY', `m[1..1] ! ANY'};
    expect:
      value: ['["a" -> 1]', '["a" -> 1]', E_RANGE, E_RANGE]

  - name: map_range_read_string_bounds_ignore_case
    statement: |
      m = ["a" -> 1, "B" -> 2];
      return {toliteral(m["a".."B"]), toliteral(m["B".."a"]), toliteral(m["A".."b"])};
    expect:
      value: ['["a" -> 1, "B" -> 2]', '[]', '["a" -> 1, "B" -> 2]']

  # Read: a list or map bound raises E_TYPE before any key is looked up.
  - name: map_range_read_collection_bound_before_key_lookup
    statement: |
      m = ["a" -> 1];
      return {`m["zz"..{}] ! ANY', `m["zz"..[]] ! ANY', `m[5..{}] ! ANY', `m["a"..{}] ! ANY', `m[{}.."zz"] ! ANY', `m[[].."a"] ! ANY', `[]["zz"..{}] ! ANY'};
    expect:
      value: [E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE]

  # Assignment: the value type is checked before either key.
  - name: map_range_assign_value_type_before_keys
    statement: |
      r = {};
      m = ["a" -> 1];
      try m["a"..1] = 3; except e (ANY) r = {@r, e[1]}; endtry
      try m["a".."z"] = 3; except e (ANY) r = {@r, e[1]}; endtry
      try m["a".."a"] = 3; except e (ANY) r = {@r, e[1]}; endtry
      try m["zz".."yy"] = {}; except e (ANY) r = {@r, e[1]}; endtry
      try m["zz".."yy"] = "s"; except e (ANY) r = {@r, e[1]}; endtry
      try m["zz"..[]] = 5; except e (ANY) r = {@r, e[1]}; endtry
      e = [];
      try e[1..0] = 5; except err (ANY) r = {@r, err[1]}; endtry
      return {r, toliteral(m)};
    expect:
      value: [[E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE, E_TYPE], '["a" -> 1]']

  # Assignment: a list or map bound is checked before either key.
  - name: map_range_assign_collection_bound_before_keys
    statement: |
      r = {};
      m = ["a" -> 1];
      try m["zz"..{}] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m["zz"..[]] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m[{}.."zz"] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m["a"..{}] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      return r;
    expect:
      value: [E_TYPE, E_TYPE, E_TYPE, E_TYPE]

  # Assignment: with a map value and key-type bounds, a missing key raises
  # E_RANGE whatever the order of the bounds.
  - name: map_range_assign_missing_key_raises_range
    statement: |
      r = {};
      m = ["a" -> 1];
      try m["zz".."a"] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m["a".."zz"] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m["a"..1] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      try m[1.."a"] = ["k" -> 1]; except e (ANY) r = {@r, e[1]}; endtry
      e = [];
      try e[1..0] = ["k" -> 1]; except err (ANY) r = {@r, err[1]}; endtry
      return r;
    expect:
      value: [E_RANGE, E_RANGE, E_RANGE, E_RANGE, E_RANGE]

  # Assignment: bounds of different types, both keys present.
  - name: map_range_assign_mixed_keys_present
    statement: |
      m = [1 -> "i", #1 -> "o", "a" -> "s"];
      m[1..#1] = ["k" -> 0];
      n = [1 -> "i", "a" -> "s"];
      n["a"..1] = ["n" -> 0];
      return {toliteral(m), toliteral(n)};
    expect:
      value: ['["a" -> "s", "k" -> 0]', '[1 -> "i", "a" -> "s", "n" -> 0]']
