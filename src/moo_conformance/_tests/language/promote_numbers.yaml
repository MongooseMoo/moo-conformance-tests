name: promote_numbers
description: Pinned Toast keeps integer and floating-point equality distinct

tests:
  - name: list_membership_distinguishes_integer_and_float
    description: List membership does not promote numeric types
    code: "1 in {1.0}"
    expect:
      value: 0

  - name: sort_rejects_mixed_integer_and_float_values
    description: Pinned Toast rejects mixed integer and float comparisons in sort()
    permission: wizard
    code: "sort({2.0, 1})"
    expect:
      error: E_TYPE

  - name: map_keys_keep_integer_and_float_identity
    description: Pinned Toast keeps integer and float map keys distinct
    statement: |
      values = [1 -> "integer", 1.0 -> "float"];
      return {length(mapkeys(values)), values[1], values[1.0], maphaskey([1.0 -> 1], 1)};
    expect:
      value: [2, "integer", "float", 0]
