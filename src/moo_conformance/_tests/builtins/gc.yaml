  # Long cyclic chains - test various chain lengths
  - name: cyclic_chain_length_2
    permission: wizard
    statement: |
      c = head = tail = #-1;
      try
        c = create($nothing);
        add_property(c, "next", 0, {player, ""});
        x = y = create(c, 1);
        head = tail = x;
        for i in [1..2]
          x.next = create(c, 1);
          x = x.next;
          tail = x;
        endfor
        x.next = y;
        run_gc();
        recycle(y);
        x = y = 0;
        head = tail = #-1;
        run_gc();
        recycle(c);
        run_gc();
        return 1;
      finally
        if (valid(tail))
          recycle(tail);
        endif
        if (valid(head))
          recycle(head);
        endif
        if (valid(c))
          recycle(c);
        endif
      endtry
    expect:
      value: 1

