  - name: audit_anonymous_values_in_suspended_vm_survive_restart
    description: >
      A valid anonymous object held in a suspended local, task-local value, and
      resume value preserves its type, validity, identity, and property data
      across a checkpoint and managed restart.
    steps:
      - run: |
          class = create($nothing);
          add_property(class, "saved_anon", 0, {player, "rw"});
          add_property(class, "audit_result", {}, {player, "rw"});
          add_property(class, "marker", "class-marker", {player, "rw"});
          add_verb(class, {player, "xd", "hold"}, {"this", "none", "this"});
          set_verb_code(class, "hold", {
            "fork id (0)",
            "  local_anon = this.saved_anon;",
            "  set_task_local({\"task-anon\", local_anon});",
            "  resumed_anon = suspend();",
            "  task_anon = task_local()[2];",
            "  this.audit_result = {task_id(), typeof(local_anon), valid(local_anon), local_anon == this.saved_anon, local_anon.marker, typeof(task_anon), valid(task_anon), task_anon == local_anon, typeof(resumed_anon), valid(resumed_anon), resumed_anon == local_anon, resumed_anon.marker};",
            "endfork",
            "suspend(0);",
            "return id;"
          });
          anon = create(class, 1);
          anon.marker = "anonymous-marker";
          class.saved_anon = anon;
          return class;
        capture: anonymous_class
        as: wizard
      - run: "return {anonymous_class}:hold();"
        capture: anonymous_task_id
        as: wizard
      - run: |
          frame = task_stack({anonymous_task_id}, 1, 1)[1];
          local_anon = frame[7]["local_anon"];
          return {
            typeof(local_anon),
            valid(local_anon),
            local_anon == {anonymous_class}.saved_anon,
            local_anon.marker
          };
        as: wizard
        expect:
          value: [12, 1, 1, anonymous-marker]
      - run: |
          resume({anonymous_task_id}, {anonymous_class}.saved_anon);
          return dump_database();
        as: wizard
        expect:
          value: 0
      - restart_server:
      - wait: 300
      - run: |
          result = {anonymous_class}.audit_result;
          still_queued = 0;
          for queued in (queued_tasks())
            if (queued[1] == {anonymous_task_id})
              still_queued = 1;
            endif
          endfor
          return {
            result[1] == {anonymous_task_id},
            result[2],
            result[3],
            result[4],
            result[5],
            result[6],
            result[7],
            result[8],
            result[9],
            result[10],
            result[11],
            result[12],
            still_queued
          };
        as: wizard
        expect:
          value: [1, 12, 1, 1, anonymous-marker, 12, 1, 1, 12, 1, 1, anonymous-marker, 0]
    cleanup:
      - run: |
          try
            kill_task({anonymous_task_id});
          except (ANY)
          endtry
          try
            recycle({anonymous_class}.saved_anon);
          except (ANY)
          endtry
          try
            recycle({anonymous_class});
          except (ANY)
          endtry
        as: wizard

  - name: audit_force_input_live_login_connection
    description: force_input() to a live negative connection runs the login input path and can log it in.
    steps:
      - run: |
          try
            add_property(#0, "audit_force_login_seen", {}, {#0, "rw"});
          except (E_INVARG)
          endtry
          try
            add_property(#0, "audit_force_login_saved", {}, {#0, "rw"});
          except (E_INVARG)
          endtry
          try
            add_property(#0, "audit_force_login_player", $nothing, {#0, "rw"});
          except (E_INVARG)
          endtry
          login_player = create($nothing);
          set_player_flag(login_player, 1);
          #0.audit_force_login_player = login_player;
          old_exists = 1;
          try
            old_info = verb_info(#0, "do_login_command");
            old_args = verb_args(#0, "do_login_command");
            old_code = verb_code(#0, "do_login_command");
          except (E_VERBNF)
            old_exists = 0;
            old_info = {};
            old_args = {};
            old_code = {};
          endtry
          #0.audit_force_login_saved = {old_exists, old_info, old_args, old_code};
          try
            add_verb(#0, {#0, "rxd", "do_login_command"}, {"this", "none", "this"});
          except (E_INVARG)
          endtry
          set_verb_info(#0, "do_login_command", {#0, "rxd", "do_login_command"});
          set_verb_args(#0, "do_login_command", {"this", "none", "this"});
          set_verb_code(#0, "do_login_command", {
            "#0.audit_force_login_seen = {!valid(player), args, argstr};",
            "if (argstr == \"audit-force-login\")",
            "  return #0.audit_force_login_player;",
            "endif",
            "return $nothing;"
          });
          return 1;
        as: wizard
      - new_connection:
          capture: conn1
      - run: |
          neg = #-1;
          for conn in (connected_players(1))
            if (!valid(conn))
              neg = conn;
            endif
          endfor
          if (neg == #-1)
            raise(E_INVARG);
          endif
          force_input(neg, "audit-force-login");
          suspend(0);
          return {
            #0.audit_force_login_seen,
            (neg in connected_players(1)) > 0,
            (#0.audit_force_login_player in connected_players(1)) > 0
          };
        as: wizard
        expect:
          value:
            -
              - 1
              -
                - audit-force-login
              - audit-force-login
            - 0
            - 1
      - close_connection: conn1
    cleanup:
      - run: |
          try
            saved = #0.audit_force_login_saved;
            if (saved[1])
              set_verb_info(#0, "do_login_command", saved[2]);
              set_verb_args(#0, "do_login_command", saved[3]);
              set_verb_code(#0, "do_login_command", saved[4]);
            else
              delete_verb(#0, "do_login_command");
            endif
          except (ANY)
          endtry
          try
            delete_property(#0, "audit_force_login_saved");
          except (ANY)
          endtry
          try
            delete_property(#0, "audit_force_login_seen");
          except (ANY)
          endtry
          try
            boot_player(#0.audit_force_login_player);
          except (ANY)
          endtry
          try
            recycle(#0.audit_force_login_player);
          except (ANY)
          endtry
          try
            delete_property(#0, "audit_force_login_player");
          except (ANY)
          endtry
        as: wizard

  - name: audit_yin_yields_when_thresholds_crossed
    description: yin() yields to a ready task when remaining ticks fall below the requested threshold.
    steps:
      - run: |
          try
            add_property($server_options, "fg_ticks", 60000, {player, "r"});
          except (E_INVARG)
            $server_options.fg_ticks = 60000;
          endtry
          try
            add_property($server_options, "fg_seconds", 60, {player, "r"});
          except (E_INVARG)
            $server_options.fg_seconds = 60;
          endtry
          load_server_options();
          return 1;
        as: wizard
      - run: |
          try
            add_property(#0, "audit_yin_order", {}, {#0, "rw"});
          except (E_INVARG)
          endtry
          #0.audit_yin_order = {"main-before"};
          threshold = ticks_left();
          fork (0)
            #0.audit_yin_order = listappend(#0.audit_yin_order, "fork");
          endfork
          yin(0, threshold, 1);
          #0.audit_yin_order = listappend(#0.audit_yin_order, "main-after");
          return #0.audit_yin_order;
        as: wizard
        expect:
          value:
            - main-before
            - fork
            - main-after
    cleanup:
      - run: |
          delete_property(#0, "audit_yin_order");
          delete_property($server_options, "fg_ticks");
          delete_property($server_options, "fg_seconds");
          load_server_options();
        as: wizard

  - name: audit_resume_after_suspend_uses_background_limits
    description: A suspended foreground task resumes with Toast background tick and second budgets.
    steps:
      - run: |
          try
            add_property($server_options, "fg_ticks", 50000, {player, "r"});
          except (E_INVARG)
            $server_options.fg_ticks = 50000;
          endtry
          try
            add_property($server_options, "bg_ticks", 9000, {player, "r"});
          except (E_INVARG)
            $server_options.bg_ticks = 9000;
          endtry
          try
            add_property($server_options, "bg_seconds", 7, {player, "r"});
          except (E_INVARG)
            $server_options.bg_seconds = 7;
          endtry
          load_server_options();
          return 1;
        as: wizard
      - run: |
          before_ticks = ticks_left();
          suspend(0);
          after_ticks = ticks_left();
          after_seconds = seconds_left();
          return {before_ticks <= 50000 && before_ticks > 49000, after_ticks <= 9000 && after_ticks > 8500, after_seconds <= 7 && after_seconds > 4};
        as: wizard
        expect:
          value:
            - 1
            - 1
            - 1
    cleanup:
      - run: |
          delete_property($server_options, "fg_ticks");
          delete_property($server_options, "bg_ticks");
          delete_property($server_options, "bg_seconds");
          load_server_options();
        as: wizard

  - name: audit_long_suspended_background_task_can_yield_after_wake
    description: Time spent suspended does not consume a background task's execution-second budget.
    steps:
      - run: |
          try
            add_property($server_options, "bg_seconds", 1, {player, "r"});
          except (E_INVARG)
            $server_options.bg_seconds = 1;
          endtry
          try
            add_property(#0, "audit_long_suspend_progress", "", {#0, "rw"});
          except (E_INVARG)
          endtry
          load_server_options();
          #0.audit_long_suspend_progress = "created";
          fork (0)
            #0.audit_long_suspend_progress = "before";
            suspend(2);
            #0.audit_long_suspend_progress = "after-long-suspend";
            suspend(0);
            #0.audit_long_suspend_progress = "after-yield";
          endfork
          suspend(0);
          return #0.audit_long_suspend_progress;
        as: wizard
        expect:
          value: before
      - wait: 3500
      - run: "return #0.audit_long_suspend_progress;"
        as: wizard
        expect:
          value: after-yield
    cleanup:
      - run: |
          try
            delete_property(#0, "audit_long_suspend_progress");
          except (ANY)
          endtry
          try
            delete_property($server_options, "bg_seconds");
          except (ANY)
          endtry
          load_server_options();
        as: wizard
