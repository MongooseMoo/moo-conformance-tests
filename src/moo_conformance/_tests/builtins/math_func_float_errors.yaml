      value: -0.98661429815143

  - name: mathfunc_tanh_negative_zero_keeps_sign
    code: "toliteral(tanh(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_acosh_just_below_one_domain
    code: "acosh(0.9999999999999999)"
    expect:
      error: E_INVARG

  - name: mathfunc_acosh_large
    code: "acosh(1e10)"
    expect:
      value: 23.7189981105004

  - name: mathfunc_acosh_one_and_half
    code: "acosh(1.5)"
    expect:
      value: 0.962423650119207

  - name: mathfunc_asinh_large
    code: "asinh(1e10)"
    expect:
      value: 23.7189981105004

  - name: mathfunc_asinh_negative_zero_keeps_sign
    code: "toliteral(asinh(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_atanh_minus_one_pole
    code: "atanh(-1.0)"
    expect:
      error: E_FLOAT

  - name: mathfunc_atanh_just_above_one_domain
    code: "atanh(1.0000000000000002)"
    expect:
