  - name: eval_program_with_600_distinct_literals
    permission: wizard
    statement: |
      source = "r = {};";
      expected = {};
      for i in [1..600]
        if (i % 2)
          source = source + " r = {@r, \"k" + tostr(i) + "\"};";
          expected = {@expected, "k" + tostr(i)};
        else
          source = source + " r = {@r, " + tostr(i) + ".5};";
          expected = {@expected, tofloat(i) + 0.5};
        endif
      endfor
      result = eval(source + " return r;");
      return {result[1], length(expected), result[2] == expected};
    expect:
      value: [1, 600, 1]
