          try
            for i in [1..1000]
              s = s + "0123456789";
            endfor
            #0.concat_abort_mark = "completed";
            return length(s);
          except e (ANY)
            #0.concat_abort_mark = "caught";
            return {"raised", e[1]};
          endtry
          finally
            #0.concat_abort_mark = "finally";
          endtry
        as: wizard
        expect:
          match: "Task ran out of seconds"
      - run: "return #0.concat_abort_mark;"
        as: wizard
        expect:
          value: started
    cleanup:
      - run: |
          $server_options.max_string_concat = 1000000;
          load_server_options();
        as: wizard

  - name: string_concat_past_limit_raises_when_catchable
    description: With max_concat_catchable true string `+` past max_string_concat raises E_QUOTA.
    steps:
      - run: |
