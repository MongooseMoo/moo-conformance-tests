name: fork_timing
description: |
  Tests fork timing behavior: zero-delay execution, delayed task visibility
  in queued_tasks(), and kill_task() preventing execution.

  Uses the `wait` step type to pause between steps, allowing forked tasks
  time to execute (or confirming they don't execute when killed).
version: "1.0"
assumes: [queued_tasks]

tests:
  - name: fork_zero_delay_executes
    description: |
      Fork with 0 delay executes immediately. After forking, wait 500ms,
      then verify the forked code set the property.
    permission: wizard
    steps:
      - run: |
          add_property(#0, "__ft_zero", 0, {#2, "r"});
          return "setup_done";
      - run: |
          fork (0)
            #0.__ft_zero = 42;
          endfork
          return "forked";
        expect:
          value: "forked"
      - wait: 500
      - run: "return #0.__ft_zero;"
        expect:
          value: 42
    cleanup:
      - run: "delete_property(#0, \"__ft_zero\");"
        as: wizard

  - name: fork_delayed_appears_in_queue
    description: |
      Fork with a long delay (30s) creates a task visible in queued_tasks().
      After verifying the task appears, kill it to clean up.
    permission: wizard
    steps:
      - run: |
          fork t (30)
            1 + 1;
          endfork
          return t;
        capture: task_id
      - run: |
          tasks = queued_tasks();
          for t in (tasks)
            if (t[1] == {task_id})
              return 1;
            endif
          endfor
          return 0;
        expect:
          value: 1
    cleanup:
      - run: "kill_task({task_id});"
        as: wizard

  - name: fork_killed_does_not_execute
    description: |
      Fork with delay, kill it, wait, verify property was NOT changed.
      The forked code would set the property to 999, but since we kill
      the task, the property should remain at its initial value.
    permission: wizard
    steps:
      - run: |
          add_property(#0, "__ft_kill", 0, {#2, "r"});
          return "setup_done";
      - run: |
          fork t (2)
            #0.__ft_kill = 999;
          endfork
          return t;
        capture: task_id
      - run: "return kill_task({task_id});"
        expect:
          value: 0
      - wait: 3000
      - run: "return #0.__ft_kill;"
        expect:
          value: 0
    cleanup:
      - run: "delete_property(#0, \"__ft_kill\");"
        as: wizard

  - name: fork_with_id_variable
    description: Named fork stores task ID as an integer
    statement: |
      fork task_id (0)
        suspend(5);
      endfork
      return typeof(task_id) == INT;
    expect:
      value: 1

  - name: fork_float_delay
    description: Float delay is accepted
    statement: |
      fork (0.5)
        suspend(5);
      endfork
      return 1;
    expect:
      value: 1

  - name: fork_zero_delay
    description: Fork with zero delay creates a queued task
    statement: |
      fork (0)
        suspend(5);
      endfork
      return length(queued_tasks()) > 0;
    expect:
      value: 1

  - name: fork_zero_delay_child_observes_rest_of_forking_slice
    description: |
      A zero-delay child starts only after the slice that forked it has ended,
      so it observes writes the parent made after the fork statement. The
      forking verb is owned by a different programmer than the connected
      player, so the child runs under a different principal than its parent.
    permission: wizard
    steps:
      - run: |
          o = create($nothing);
          add_property(o, "mark", 0, {o, "rw"});
          add_property(o, "saw", -1, {o, "rw"});
          add_verb(o, {o, "xd", "spawn"}, {"this", "none", "this"});
          set_verb_code(o, "spawn", {"fork (0)", "  this.saw = this.mark;", "endfork", "big = \"abcdefghij\";", "for i in [1..14]", "  big = big + big;", "endfor", "for i in [1..200]", "  string_hash(big);", "endfor", "this.mark = 1;"});
          return o;
        capture: obj
      - run: |
          {obj}:spawn();
          return "spawned";
        expect:
          value: "spawned"
      - wait: 500
      - run: "return {obj}.saw;"
        expect:
          value: 1
    cleanup:
      - run: "recycle({obj});"
        as: wizard

  - name: suspend_zero_read_only_parent_observes_ready_child
    description: |
      A task that forks a zero-delay child and then calls suspend(0) resumes
      only after the child's slice has finished, even when the resumed task
      only reads. The child becomes ready before the parent's suspension, so
      it runs first and the parent observes its write.
    permission: wizard
    steps:
      - run: |
          add_property(#0, "__ft_ready_child", 0, {#2, "r"});
          return "setup_done";
      - run: |
          fork (0)
            for i in [1..3000]
            endfor
            #0.__ft_ready_child = 1;
          endfork
          suspend(0);
          return #0.__ft_ready_child;
        expect:
          value: 1
    cleanup:
      - run: "delete_property(#0, \"__ft_ready_child\");"
        as: wizard

  - name: suspend_zero_queued_tasks_lists_child_suspended_first
    description: |
      After suspend(0), queued_tasks() lists a zero-delay child that ran to
      its own suspend() before the parent resumed. A child that is still
      running would be absent from queued_tasks(). The fork is made inside a
      verb, as in ordinary MOO code.
    permission: wizard
    statement: |
      o = create($nothing);
      add_verb(o, {player, "xd", "park"}, {"this", "none", "this"});
      set_verb_code(o, "park", {"for i in [1..3000]", "endfor", "suspend();"});
      add_verb(o, {player, "xd", "run"}, {"this", "none", "this"});
      set_verb_code(o, "run", {"fork child (0)", "  this:park();", "endfork", "suspend(0);", "found = 0;", "for entry in (queued_tasks())", "  if (entry[1] == child)", "    found = 1;", "  endif", "endfor", "kill_task(child);", "return found;"});
      result = o:run();
      recycle(o);
      return result;
    expect:
      value: 1

  - name: suspend_zero_after_resume_observes_resumed_slice
    description: |
      resume() readies the target at once, so a task that resumes another and
      then calls suspend(0) resumes only after the target's next slice has
      finished.
    permission: wizard
    steps:
      - run: |
          add_property(#0, "__ft_resumed_child", 0, {#2, "r"});
          return "setup_done";
      - run: |
          fork child (0)
            suspend();
            for i in [1..3000]
            endfor
            #0.__ft_resumed_child = 1;
          endfork
          suspend(0);
          resume(child);
          suspend(0);
          return #0.__ft_resumed_child;
        expect:
          value: 1
    cleanup:
      - run: "delete_property(#0, \"__ft_resumed_child\");"
        as: wizard
