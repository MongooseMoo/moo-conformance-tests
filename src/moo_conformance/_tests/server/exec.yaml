name: exec
description: Forked task inspection and control during exec().
requires:
  builtins:
  - exec
  - queued_tasks
  - kill_task
  - resume
  - task_stack
  features:
  - exec_support
  - forking
  - tasks
tests:
- name: queued_tasks_shows_suspended_exec
  permission: wizard
  statement: |
    fork go (0)
      exec({"sleep", "1"});
    endfork
    suspend(0.1);
    found = 0;
    for task in (queued_tasks())
      if (task[1] == go)
        found = 1;
      endif
    endfor
    try
      kill_task(go);
    except e (ANY)
    endtry
    return found;
  expect:
    value: 1
- name: kill_task_works_on_suspended_exec
  permission: wizard
  statement: "fork go (0)\n  exec({\"sleep\", \"1\"});\nendfork\nsuspend(0.1);\n\
    result = kill_task(go);\nreturn result;\n"
  expect:
    value: 0
- name: kill_task_fails_on_already_killed
  permission: wizard
  statement: "fork go (0)\n  exec({\"sleep\", \"1\"});\nendfork\nsuspend(0.1);\n\
    kill_task(go);\nreturn kill_task(go);\n"
  expect:
    error: E_INVARG
- name: resume_fails_on_suspended_exec
  permission: wizard
  statement: "fork go (0)\n  exec({\"sleep\", \"1\"});\nendfork\nsuspend(0.1);\n\
    try\n  resume(go);\nexcept e (E_INVARG)\n  kill_task(go);\n  return e[1];\nendtry\n\
    kill_task(go);\nreturn \"resume unexpectedly succeeded\";\n"
  expect:
    value: E_INVARG
- name: suspended_exec_task_stack_matches_suspended_task
  permission: wizard
  statement: "fork go1 (0)\n  suspend(1);\nendfork\nfork go2 (0)\n  exec({\"sleep\"\
    , \"1\"});\nendfork\nsuspend(0.1);\nstack1 = task_stack(go1);\nstack2 = task_stack(go2);\n\
    try\n  kill_task(go1);\nexcept e (ANY)\nendtry\ntry\n  kill_task(go2);\nexcept\
    \ e (ANY)\nendtry\nreturn stack1 == stack2 && go1 != go2;\n"
  expect:
    value: 1
- name: multiple_simultaneous_execs_work
  permission: wizard
  statement: |
    task_ids = {};
    for n in ({1, 2, 3, 4})
      fork go (0)
        exec({"sleep", "1"});
      endfork
      task_ids = listappend(task_ids, go);
    endfor
    suspend(0.1);
    seen_before = {};
    for task in (queued_tasks())
      if (task[1] in task_ids)
        seen_before = setadd(seen_before, task[1]);
      endif
    endfor
    kill_task(task_ids[1]);
    kill_task(task_ids[3]);
    seen_after = {};
    for task in (queued_tasks())
      if (task[1] in task_ids)
        seen_after = setadd(seen_after, task[1]);
      endif
    endfor
    kill_task(task_ids[2]);
    kill_task(task_ids[4]);
    return length(seen_before) == 4
      && task_ids[2] in seen_after
      && task_ids[4] in seen_after
      && !(task_ids[1] in seen_after)
      && !(task_ids[3] in seen_after);
  expect:
    value: 1
