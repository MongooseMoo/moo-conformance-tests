  - name: map_indexset_past_limit_raises_when_catchable
    description: With max_concat_catchable true map index assignment past max_map_value_bytes raises E_QUOTA.
    steps:
      - run: |
          $server_options.max_concat_catchable = 1;
          $server_options.max_map_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          m = [];
          try
