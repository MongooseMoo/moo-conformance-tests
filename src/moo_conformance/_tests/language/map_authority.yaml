name: map_authority
description: >
  Portable MAP comparator, key-surface, literal-evaluation, and multi-delete
  error behavior.
requires:
  builtins:
    - create
    - equal
    - length
    - mapdelete
    - maphaskey
    - mapkeys
    - mapvalues
    - new_waif
    - recycle
    - toliteral
tests:
  - name: int_keys_separated_by_2_to_32_collide_and_replace
    skip_if: "not feature.64bit"
    statement: |
      mapping = [0 -> "zero", 4294967296 -> "wide"];
      before = {
        length(mapping), mapping[0], mapping[4294967296], mapkeys(mapping)
      };
      mapping[0] = "replacement";
      return {
        before,
        length(mapping), mapping[0], mapping[4294967296], mapkeys(mapping)
      };
    expect:
      value:
        - [2, "zero", "wide", [0, 4294967296]]
        - 2
        - "replacement"
        - "wide"
        - [0, 4294967296]

  - name: full_width_integer_map_keys_order_numerically
    skip_if: "not feature.64bit"
    statement: |
      mapping = [4294967297 -> "a", 1 -> "b", -4294967295 -> "c",
                 2147483648 -> "d", 0 -> "e"];
      return {
        length(mapping), mapping[1], mapping[4294967297],
        mapping[-4294967295], mapkeys(mapping)
      };
    expect:
      value:
        - 5
        - "b"
        - "a"
        - "c"
        - [-4294967295, 0, 1, 2147483648, 4294967297]

  - name: full_width_object_map_keys_order_numerically
    skip_if: "not feature.64bit"
    statement: |
      mapping = [#4294967297 -> "a", #1 -> "b", #-4294967295 -> "c",
                 #2147483648 -> "d", #0 -> "e"];
      return {
        length(mapping), mapping[#1], mapping[#4294967297],
        mapping[#-4294967295], toliteral(mapkeys(mapping))
      };
    expect:
      value:
        - 5
        - "b"
        - "a"
        - "c"
        - "{#-4294967295, #0, #1, #2147483648, #4294967297}"

  - name: anon_keys_work_in_vm_mapvalues_and_key_builtins
    statement: |
      anon = create($anonymous, 1);
      literal = [anon -> "literal"];
      indexed = [];
      indexed[anon] = "indexed";
      result = {
        literal[anon], indexed[anon], mapvalues(literal, anon),
        maphaskey(literal, anon), mapdelete(literal, anon)
      };
      recycle(anon);
      return result;
    expect:
      value: ["literal", "indexed", ["literal"], 1, {}]

  - name: maphaskey_finds_present_anon_key_and_not_absent_anon_key
    statement: |
      present = create($anonymous, 1);
      absent = create($anonymous, 1);
      mapping = [present -> 1];
      result = {maphaskey(mapping, present), maphaskey(mapping, absent)};
      recycle(present);
      recycle(absent);
      return result;
    expect:
      value: [1, 0]

  - name: mapdelete_removes_present_anon_keys_singly_and_by_list
    statement: |
      first = create($anonymous, 1);
      second = create($anonymous, 1);
      mapping = [first -> 1, second -> 2];
      single = mapdelete(mapping, first);
      multi = mapdelete(mapping, {first, second});
      result = {
        length(single), maphaskey(single, first), maphaskey(single, second),
        length(multi)
      };
      recycle(first);
      recycle(second);
      return result;
    expect:
      value: [1, 0, 1, 0]

  - name: mapdelete_absent_anon_key_raises_range
    statement: |
      absent = create($anonymous, 1);
      try
        ignored = mapdelete([1 -> 2, 3 -> 4], absent);
        result = E_NONE;
      except error (ANY)
        result = error[1];
      endtry
      recycle(absent);
      return result;
    expect:
      value: E_RANGE

  - name: multi_key_mapdelete_absent_anon_key_raises_range_with_that_key
    statement: |
      present = create($anonymous, 1);
      absent = create($anonymous, 1);
      try
        ignored = mapdelete([present -> 1], {present, absent});
        result = {E_NONE};
      except error (ANY)
        result = {error[1], error[2], error[3] == absent, error[3] == present};
      endtry
      recycle(present);
      recycle(absent);
      return result;
    expect:
      value: [E_RANGE, "Key *anonymous* not found in map", 1, 0]

  - name: bool_map_keys_order_false_before_true_in_any_insertion_order
    statement: |
      false_first = [false -> 0, true -> 1];
      true_first = [true -> 1, false -> 0];
      return {
        mapkeys(false_first) == {false, true},
        mapkeys(true_first) == {false, true},
        toliteral(false_first) == "[false -> 0, true -> 1]",
        toliteral(true_first) == "[false -> 0, true -> 1]",
        false_first == true_first,
        equal(false_first, true_first)
      };
    expect:
      value: [1, 1, 1, 1, 1, 1]

  # Toast orders waif and anonymous-object keys by address, so which of two
  # such keys comes first is unspecified; the order must not depend on the
  # order the keys were inserted in.
  - name: waif_key_map_order_is_independent_of_insertion_order
    statement: |
      class = create($waif);
      first = class:new();
      second = class:new();
      first_first = [first -> 1, second -> 2];
      second_first = [second -> 2, first -> 1];
      result = {
        (mapkeys(first_first) in {{first, second}, {second, first}}) > 0,
        equal(mapkeys(first_first), mapkeys(second_first)),
        first_first[first] == 1 && first_first[second] == 2,
        second_first[first] == 1 && second_first[second] == 2,
        first_first == second_first,
        equal(first_first, second_first)
      };
      recycle(class);
      return result;
    expect:
      value: [1, 1, 1, 1, 1, 1]

  - name: anon_key_map_order_is_independent_of_insertion_order
    statement: |
      first = create($anonymous, 1);
      second = create($anonymous, 1);
      first_first = [first -> 1, second -> 2];
      second_first = [second -> 2, first -> 1];
      result = {
        (mapkeys(first_first) in {{first, second}, {second, first}}) > 0,
        equal(mapkeys(first_first), mapkeys(second_first)),
        first_first[first] == 1 && first_first[second] == 2,
        second_first[first] == 1 && second_first[second] == 2,
        first_first == second_first,
        equal(first_first, second_first)
      };
      recycle(first);
      recycle(second);
      return result;
    expect:
      value: [1, 1, 1, 1, 1, 1]

  - name: map_literal_evaluates_each_value_before_its_key
    statement: |
      trace = {};
      mapping = [
        ((trace = {@trace, "key"}) ? "key" | "unreachable")
        ->
        ((trace = {@trace, "value"}) ? "value" | "unreachable")
      ];
      return {trace, mapping["key"]};
    expect:
      value: [["value", "key"], "value"]

  - name: multi_key_mapdelete_raises_missing_key_detail
    statement: |
      mapping = [1 -> "one", 2 -> "two", 3 -> "three"];
      try
        return mapdelete(mapping, {1, 99, 3});
      except error (ANY)
        return {error[1], error[2], error[3]};
      endtry
    expect:
      value: [E_RANGE, "Key 99 not found in map", 99]
