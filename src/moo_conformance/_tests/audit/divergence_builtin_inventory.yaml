name: divergence_builtin_inventory
description: >
  ToastStunt's builtin inventory is the specification: servers must not expose
  builtins Toast does not define. function_info(name) raises E_INVARG for every
  name absent from the stock Toast function registry (2026-08-30 campaign).

tests:
  - name: builtin_inventory_no_background_test
    code: "function_info(\"background_test\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_capitalize
    code: "function_info(\"capitalize\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_connection_option
    code: "function_info(\"connection_option\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_downcase
    code: "function_info(\"downcase\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_finished_tasks
    code: "function_info(\"finished_tasks\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_implode
    code: "function_info(\"implode\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_ltrim
    code: "function_info(\"ltrim\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_malloc_stats
    code: "function_info(\"malloc_stats\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_mapmerge
    code: "function_info(\"mapmerge\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_read_stdin
    code: "function_info(\"read_stdin\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_rtrim
    code: "function_info(\"rtrim\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_trim
    code: "function_info(\"trim\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_unique
    code: "function_info(\"unique\")"
    expect:
      error: E_INVARG

  - name: builtin_inventory_no_upcase
    code: "function_info(\"upcase\")"
    expect:
      error: E_INVARG
