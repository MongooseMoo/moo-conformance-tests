name: math_func_float_errors
description: >
  The float builtins ToastStunt defines with its MATH_FUNC macro (sqrt, cbrt,
  sin, cos, tan, asin, acos, sinh, cosh, tanh, acosh, asinh, atanh, exp, log,
  log10, ceil, floor) call the C library and map its result: a domain error
  (EDOM) is E_INVARG; a range error (ERANGE) or a result outside the finite
  float range is E_FLOAT; otherwise the float. Pins overflow, underflow,
  poles, domain edges, subnormal arguments, large arguments and negative zero.
  NaN and infinite arguments cannot be produced in MOO, so none appear here.

requires:
  builtins:
    - sqrt
    - cbrt
    - sin
    - cos
    - tan
    - asin
    - acos
    - sinh
    - cosh
    - tanh
    - acosh
    - asinh
    - atanh
    - exp
    - log
    - log10
    - ceil
    - floor
    - toliteral

tests:
  - name: mathfunc_sqrt_negative_tiny_domain
    code: "sqrt(-1e-300)"
    expect:
      error: E_INVARG

  - name: mathfunc_sqrt_negative_zero_keeps_sign
    code: "toliteral(sqrt(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_sqrt_max_float
    code: "sqrt(1.7976931348623157e308)"
    expect:
      value: 1.34078079299426e+154

  - name: mathfunc_cbrt_near_709
    code: "cbrt(709.79)"
    expect:
      value: 8.92024177054545

  - name: mathfunc_cbrt_negative_745
    code: "cbrt(-745.2)"
    expect:
      value: -9.06617884726421

  - name: mathfunc_cbrt_negative_fraction
    code: "cbrt(-0.3)"
    expect:
      value: -0.669432950082169

  - name: mathfunc_cbrt_negative_zero_keeps_sign
    code: "toliteral(cbrt(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_sin_large_argument
    code: "sin(1e22)"
    expect:
      value: -0.852200849767189

  - name: mathfunc_sin_half
    code: "sin(0.5)"
    expect:
      value: 0.479425538604203

  - name: mathfunc_sin_negative_zero_keeps_sign
    code: "toliteral(sin(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_cos_large_argument
    code: "cos(1e300)"
    expect:
      value: -0.575386111957549

  - name: mathfunc_cos_half
    code: "cos(0.5)"
    expect:
      value: 0.877582561890373

  - name: mathfunc_tan_large_argument
    code: "tan(1e300)"
    expect:
      value: 1.42144882387472

  - name: mathfunc_tan_negative_zero_keeps_sign
    code: "toliteral(tan(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_asin_just_above_one_domain
    code: "asin(1.0000000000000002)"
    expect:
      error: E_INVARG

  - name: mathfunc_asin_half
    code: "asin(0.5)"
    expect:
      value: 0.523598775598299

  - name: mathfunc_asin_negative_zero_keeps_sign
    code: "toliteral(asin(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_acos_just_below_minus_one_domain
    code: "acos(-1.0000000000000002)"
    expect:
      error: E_INVARG

  - name: mathfunc_acos_half
    code: "acos(0.5)"
    expect:
      value: 1.0471975511966

  - name: mathfunc_sinh_overflow_large
    code: "sinh(3e300)"
    expect:
      error: E_FLOAT

  - name: mathfunc_sinh_overflow_negative_large
    code: "sinh(-3e300)"
    expect:
      error: E_FLOAT

  - name: mathfunc_sinh_overflow_just_past_threshold
    code: "sinh(711.0)"
    expect:
      error: E_FLOAT

  - name: mathfunc_sinh_overflow_max_float
    code: "sinh(1.7976931348623157e308)"
    expect:
      error: E_FLOAT

  - name: mathfunc_sinh_finite_below_overflow_threshold
    code: "sinh(-710.4)"
    expect:
      value: -1.66636428328065e+308

  - name: mathfunc_sinh_finite_above_exp_overflow
    code: "sinh(709.78)"
    expect:
      value: 8.96411397197258e+307

  - name: mathfunc_sinh_twenty_five
    code: "sinh(25.0)"
    expect:
      value: 36002449668.6929

  - name: mathfunc_sinh_small
    code: "sinh(0.3)"
    expect:
      value: 0.304520293447143

  - name: mathfunc_sinh_negative_zero_keeps_sign
    code: "toliteral(sinh(-0.0))"
    expect:
      value: "-0.0"

  - name: mathfunc_sinh_negative_subnormal
    code: "toliteral(sinh(-1e-310))"
    expect:
      value: "-9.99999999999997e-311"

  - name: mathfunc_cosh_overflow_large
    code: "cosh(3e300)"
    expect:
      error: E_FLOAT

  - name: mathfunc_cosh_overflow_negative_large
    code: "cosh(-3e300)"
