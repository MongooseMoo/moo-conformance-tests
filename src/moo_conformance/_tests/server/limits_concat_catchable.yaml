  - name: builtin_list_result_at_list_limit_is_allowed
    description: Toast's list builtins refuse only a result of more than max_list_value_bytes; decode_binary() returning exactly the limit succeeds.
    steps:
      - run: |
          $server_options.max_concat_catchable = 1;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          s = "";
          for i in [1..30]
            s = s + "aaaaaaaaaa";
          endfor
          n = value_bytes(decode_binary(s, 1));
          $server_options.max_list_value_bytes = n;
          load_server_options();
          at_limit = `decode_binary(s, 1) ! ANY';
          $server_options.max_list_value_bytes = n - 1;
          load_server_options();
          over_limit = `decode_binary(s, 1) ! ANY';
          return {typeof(at_limit) == LIST, over_limit};
        as: wizard
        expect:
          value: [1, "E_QUOTA"]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

