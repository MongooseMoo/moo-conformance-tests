name: startup_panic_live_waif_anon_roots
description: Verifies panic dumping while a suspended task owns WAIF and anonymous roots.
server_db: PanicLiveWaifAnonRoots.db
requires:
  config:
    - managed_server
    - server_dir
    - log_file
    - server_db_dir
tests:
  - name: panic_dump_preserves_live_task_roots_without_pending_root_promotion
    steps:
      - wait_for_server_exit: {timeout_ms: 5000, exit_code: -6}
      - assert_log:
          contains: "ORACLE LIVE ROOT HOLDER SUSPENDED"
      - assert_log:
          contains: "PANIC: ORACLE PANIC WITH LIVE ROOTS"
      - assert_file:
          path: PanicLiveWaifAnonRoots.db.new.PANIC
          contains: "0 values pending finalization"
      - assert_file:
          path: PanicLiveWaifAnonRoots.db.new.PANIC
          contains: "1 suspended tasks"
      - assert_file:
          path: PanicLiveWaifAnonRoots.db.new.PANIC
          contains: |-
            state
            4
            2
            13
            c 0
            9
            3
            0
            -1
            .
            12
            10
      - assert_file:
          path: PanicLiveWaifAnonRoots.db.new.PANIC
          contains: |-
            #10

            0
            3
            1
            -1
