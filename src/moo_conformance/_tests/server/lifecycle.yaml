name: server_lifecycle
description: Tests for server lifecycle verb invocation

tests:
  # ============================================
  # do_command Tests
  # ============================================
  # #0:do_command is called for every command before normal parsing
  # If it returns true, command is handled; false continues to verb parsing
  # NOTE: do_command runs with restricted permissions - can't call notify()

  - name: do_command_return_true_stops_parsing
    description: do_command returning true prevents normal verb dispatch
    steps:
      - run: |
          add_verb(#0, {#0, "rxd", "do_command"}, {"this", "none", "this"});
          set_verb_code(#0, "do_command", {
            "if (args[1][1] == \";\")",
            "  return 0;",
            "endif",
            "return 1;"
          });
          add_verb(player, {player, "xd", "testverb"}, {"none", "none", "none"});
          set_verb_code(player, "testverb", {"notify(player, \"VERB_CALLED\");"});
          return 1;
        as: wizard
      # If do_command returns 1, the verb should NOT be called
      - command: "testverb"
        expect:
          output: []
    cleanup:
      - run: 'delete_verb(#0, "do_command");'
        as: wizard
      - run: 'delete_verb(player, "testverb");'
        as: wizard

  - name: do_command_return_false_continues_parsing
    description: do_command returning false allows normal verb dispatch
    steps:
      - run: |
          add_verb(#0, {#0, "rxd", "do_command"}, {"this", "none", "this"});
          set_verb_code(#0, "do_command", {
            "return 0;"
          });
          add_verb(player, {player, "xd", "passthrough"}, {"none", "none", "none"});
          set_verb_code(player, "passthrough", {"notify(player, \"VERB_CALLED\");"});
          return 1;
        as: wizard
      - command: "passthrough"
        expect:
          output: "VERB_CALLED"
    cleanup:
      - run: 'delete_verb(#0, "do_command");'
        as: wizard
      - run: 'delete_verb(player, "passthrough");'
        as: wizard

  # ============================================
  # do_out_of_band_command Tests
  # ============================================
  # Commands starting with #$# bypass normal parsing
  # NOTE: do_out_of_band_command also runs with restricted permissions

  - name: oob_command_bypasses_normal_parsing
    description: '#$# prefix bypasses normal verb dispatch'
    steps:
      - run: |
          marker = "moo-conformance-oob-v1";
          try
            property_info(#0, "conformance_oob_saved");
            raise(E_INVARG);
          except (E_PROPNF)
          endtry
          try
            property_info(#0, "conformance_oob_args");
            raise(E_INVARG);
          except (E_PROPNF)
          endtry
          old_exists = 1;
          try
            old_info = verb_info(#0, "do_out_of_band_command");
            old_args = verb_args(#0, "do_out_of_band_command");
            old_code = verb_code(#0, "do_out_of_band_command");
          except (E_VERBNF)
            old_exists = 0;
            old_info = {};
            old_args = {};
            old_code = {};
          endtry
          add_property(#0, "conformance_oob_saved", {marker, old_exists, old_info, old_args, old_code}, {#0, "rw"});
          add_property(#0, "conformance_oob_args", {}, {#0, "rw"});
          if (!old_exists)
            add_verb(#0, {#0, "rxd", "do_out_of_band_command"}, {"this", "none", "this"});
          else
            set_verb_info(#0, "do_out_of_band_command", {#0, "rxd", "do_out_of_band_command"});
            set_verb_args(#0, "do_out_of_band_command", {"this", "none", "this"});
          endif
          set_verb_code(#0, "do_out_of_band_command", {
            "#0.conformance_oob_args = args;",
            "return 1;"
          });
          return 1;
        as: wizard
      - command: "#$#conformance-oob alpha beta"
      - run: "return #0.conformance_oob_args;"
        as: wizard
        expect:
          value: ["#$#conformance-oob", "alpha", "beta"]
      - run: |
          saved = #0.conformance_oob_saved;
          if (length(saved) != 5 || saved[1] != "moo-conformance-oob-v1")
            raise(E_INVARG);
          endif
          if (saved[2])
            try
              verb_info(#0, "do_out_of_band_command");
            except (E_VERBNF)
              add_verb(#0, saved[3], saved[4]);
            endtry
            set_verb_info(#0, "do_out_of_band_command", saved[3]);
            set_verb_args(#0, "do_out_of_band_command", saved[4]);
            set_verb_code(#0, "do_out_of_band_command", saved[5]);
            restored = verb_info(#0, "do_out_of_band_command") == saved[3]
              && verb_args(#0, "do_out_of_band_command") == saved[4]
              && verb_code(#0, "do_out_of_band_command") == saved[5];
          else
            try
              delete_verb(#0, "do_out_of_band_command");
            except (E_VERBNF)
            endtry
            restored = 0;
            try
              verb_info(#0, "do_out_of_band_command");
            except (E_VERBNF)
              restored = 1;
            endtry
          endif
          if (!restored)
            raise(E_INVARG);
          endif
          delete_property(#0, "conformance_oob_args");
          delete_property(#0, "conformance_oob_saved");
          return 1;
        as: wizard
        expect:
          value: 1
    cleanup:
      - run: |
          owned = 0;
          saved = {};
          try
            saved = #0.conformance_oob_saved;
            owned = length(saved) == 5 && saved[1] == "moo-conformance-oob-v1";
          except (ANY)
            owned = 0;
          endtry
          if (owned)
            restored = 0;
            if (saved[2])
              try
                verb_info(#0, "do_out_of_band_command");
              except (E_VERBNF)
                try
                  add_verb(#0, saved[3], saved[4]);
                except (ANY)
                endtry
              endtry
              try
                set_verb_info(#0, "do_out_of_band_command", saved[3]);
              except (ANY)
              endtry
              try
                set_verb_args(#0, "do_out_of_band_command", saved[4]);
              except (ANY)
              endtry
              try
                set_verb_code(#0, "do_out_of_band_command", saved[5]);
              except (ANY)
              endtry
              try
                restored = verb_info(#0, "do_out_of_band_command") == saved[3]
                  && verb_args(#0, "do_out_of_band_command") == saved[4]
                  && verb_code(#0, "do_out_of_band_command") == saved[5];
              except (ANY)
                restored = 0;
              endtry
            else
              try
                delete_verb(#0, "do_out_of_band_command");
              except (E_VERBNF)
              endtry
              try
                verb_info(#0, "do_out_of_band_command");
              except (E_VERBNF)
                restored = 1;
              endtry
            endif
            if (restored)
              observation_removed = 0;
              try
                delete_property(#0, "conformance_oob_args");
                observation_removed = 1;
              except problem (ANY)
                observation_removed = problem[1] == E_PROPNF;
              endtry
              if (observation_removed)
                try
                  delete_property(#0, "conformance_oob_saved");
                except (ANY)
                endtry
              endif
            endif
          endif
        as: wizard

  # ============================================
  # recycle Verb Tests
  # ============================================
  # object:recycle() is called just before object destruction

  - name: recycle_verb_called_on_object
    description: Object recycle verb is called before destruction
    steps:
      - run: |
          add_property(#0, "recycle_log", {}, {#0, "w"});
          obj = create($nothing);
          add_verb(obj, {#0, "xd", "recycle"}, {"this", "none", "none"});
          set_verb_code(obj, "recycle", {
            "#0.recycle_log = {@#0.recycle_log, this};"
          });
          return obj;
        capture: obj
        as: wizard
      - run: |
          recycle({obj});
          return length(#0.recycle_log) > 0;
        as: wizard
        expect:
          value: 1
    cleanup:
      - run: 'delete_property(#0, "recycle_log");'
        as: wizard

  - name: recycle_verb_this_is_recycled_object
    description: In recycle verb, this refers to the object being recycled
    steps:
      - run: |
          add_property(#0, "recycle_this", #-1, {#0, "w"});
          obj = create($nothing);
          add_verb(obj, {#0, "xd", "recycle"}, {"this", "none", "none"});
          set_verb_code(obj, "recycle", {
            "#0.recycle_this = this;"
          });
          return obj;
        capture: obj
        as: wizard
      - run: |
          recycle({obj});
          return #0.recycle_this == {obj};
        as: wizard
        expect:
          value: 1
    cleanup:
      - run: 'delete_property(#0, "recycle_this");'
        as: wizard

  - name: recycle_verb_player_is_caller
    description: In recycle verb, player is who initiated recycle
    steps:
      - run: |
          add_property(#0, "recycle_player", #-1, {#0, "w"});
          obj = create($nothing);
          add_verb(obj, {#0, "xd", "recycle"}, {"this", "none", "none"});
          set_verb_code(obj, "recycle", {
            "#0.recycle_player = player;"
          });
          return obj;
        capture: obj
        as: wizard
      - run: |
          recycle({obj});
          return #0.recycle_player;
        as: wizard
        expect:
          match: "#\\d+"
    cleanup:
      - run: 'delete_property(#0, "recycle_player");'
        as: wizard

  # ============================================
  # Multi-Connection Tests
  # ============================================
  # These tests use secondary socket connections to test lifecycle verbs

  - name: new_connection_opens_socket
    description: new_connection opens a secondary socket to the server
    steps:
      - new_connection:
          capture: conn1
      - close_connection: conn1

  - name: new_connection_receives_welcome
    description: new_connection receives server welcome message
    steps:
      - new_connection:
          capture: conn1
      - send:
          connection: conn1
          text: "connect Wizard"
        capture: login_output
        expect:
          output:
            match: "Connected"
      - close_connection: conn1
