name: Toast conformance

on:
  pull_request_target:
  push:
    branches:
      - main

concurrency:
  group: toast-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  toast-suite:
    name: Complete Toast conformance
    permissions:
      contents: read
    uses: ./.github/workflows/toast-conformance-core.yml
    with:
      conformance_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  report-pr-head-checks:
    name: Report required checks on exact PR head
    if: always() && github.event_name == 'pull_request_target'
    needs:
      - toast-suite
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      pull-requests: read

    steps:
      - name: Verify and report exact PR-head required checks
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_RESULT: ${{ needs.toast-suite.outputs.quality_result }}
          FULL_SUITE_RESULT: ${{ needs.toast-suite.outputs.full_suite_result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["TESTED_HEAD_SHA"]
          base_sha = os.environ["TESTED_BASE_SHA"]
          pr_number = os.environ["PR_NUMBER"]
          if re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              raise SystemExit("invalid tested pull-request head SHA")
          if re.fullmatch(r"[0-9a-f]{40}", base_sha) is None:
              raise SystemExit("invalid tested pull-request base SHA")
          if re.fullmatch(r"[1-9][0-9]*", pr_number) is None:
              raise SystemExit("invalid pull-request number")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          pull_request = urllib.request.Request(
              f"{api_url}/repos/{repository}/pulls/{pr_number}", headers=headers
          )
          with urllib.request.urlopen(pull_request) as response:
              if response.status != 200:
                  raise SystemExit(f"cannot re-fetch pull request: HTTP {response.status}")
              current = json.load(response)
          if current["state"] != "open":
              raise SystemExit("pull request is no longer open")
          if current["head"]["sha"] != head_sha or current["base"]["sha"] != base_sha:
              raise SystemExit("pull-request head or base changed during validation")
          if current["base"]["repo"]["full_name"] != repository:
              raise SystemExit("pull-request base repository changed during validation")

          details_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          conclusions = {
              "Harness, schema, duplicates, types, and lint": (
                  "success" if os.environ["QUALITY_RESULT"] == "success" else "failure"
              ),
              "Full suite": (
                  "success"
                  if os.environ["FULL_SUITE_RESULT"] == "success"
                  else "failure"
              ),
          }
          for name, conclusion in conclusions.items():
              body = json.dumps(
                  {
                      "name": name,
                      "head_sha": head_sha,
                      "status": "completed",
                      "conclusion": conclusion,
                      "details_url": details_url,
                      "output": {
                          "title": name,
                          "summary": (
                              "Trusted base-owned validation passed."
                              if conclusion == "success"
                              else "Trusted base-owned validation failed."
                          ),
                      },
                  }
              ).encode()
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/check-runs",
                  data=body,
                  method="POST",
                  headers={**headers, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(
                          f"cannot report required check {name!r}: HTTP {response.status}"
                      )
          PY
