name: startup_script_callback_context
description: Launch options pass script lines to do_start_script before server_started with fresh server frames.
requires:
  builtins: [dump_database]
  config: [managed_server, server_dir]
tests:
  - name: startup_script_{lookup}_does_not_execute_argument_as_code
    table:
      columns: [lookup, installed]
      rows: [[absent, 0], [nonexecutable, 1]]
    steps:
      - restart_server: {reset_db: true}
      - run: |
          add_property(#0, "cb_events", {}, {player, "rw"});
          add_property(#0, "cb_executed", 0, {player, "rw"});
          owner = create($nothing); owner.programmer = 1;
          add_property(#0, "cb_owner", owner, {player, "r"});
          for name in ({"do_start_script", "server_started"})
            try delete_verb(#0, name); except (E_VERBNF) endtry
          endfor
          if ({installed})
            add_verb(#0, {owner, "rd", "do_start_script"}, {"this", "none", "this"});
            set_verb_code(#0, "do_start_script", {"#0.cb_executed = 2;"});
          endif
          add_verb(#0, {owner, "rxd", "server_started"}, {"this", "none", "this"});
          set_verb_code(#0, "server_started", {
            "#0.cb_events = {@#0.cb_events, {verb, this, caller, player, args, argstr, dobj, dobjstr, prepstr, iobj, iobjstr, task_perms(), caller_perms(), callers()}};"
          });
          return dump_database();
        as: wizard
        expect: {value: 0}
      - restart_server:
          checkpoint_timeout_ms: 10000
          arguments: ["--start-line", "#0.cb_executed = 1;"]
      - run: |
          return {
            #0.cb_executed,
            #0.cb_events == {{"server_started", #0, #-1, #-1, {}, "", #-1, "", "", #-1, "", #0.cb_owner, #-1, {}}}
          };
        as: wizard
        expect: {value: [0, 1]}
      - restart_server: {reset_db: true}

  - name: startup_line_{outcome}_context_and_order
    table:
      columns: [outcome, tail]
      rows:
        - [return, "return 93;"]
        - [error, "raise(E_INVARG);"]
        - [suspend, "suspend(0); return 0;"]
    steps:
      - restart_server: {reset_db: true}
      - run: |
          add_property(#0, "cb_events", {}, {player, "rw"});
          owner = create($nothing); owner.programmer = 1;
          add_property(#0, "cb_owner", owner, {player, "r"});
          for name in ({"do_start_script", "server_started"})
            try delete_verb(#0, name); except (E_VERBNF) endtry
            add_verb(#0, {owner, "rxd", name}, {"this", "none", "this"});
            set_verb_code(#0, name, {
              "#0.cb_events = {@#0.cb_events, {verb, this, caller, player, args, argstr, dobj, dobjstr, prepstr, iobj, iobjstr, task_perms(), caller_perms(), callers()}};"
            });
          endfor
          set_verb_code(#0, "do_start_script", {@verb_code(#0, "do_start_script"), "{tail}"});
          return dump_database();
        as: wizard
        expect: {value: 0}
      - write_file:
          path: callback startup.moo
          content: "first line\n\nlast line\n"
      - restart_server:
          checkpoint_timeout_ms: 10000
          arguments: ["--start-line","one; $literal {braces}"]
      - run: |
          return #0.cb_events == {
            {"do_start_script", #0, #-1, #-1, {"one; $literal {braces}"}, "", #-1, "", "", #-1, "", #0.cb_owner, #-1, {}},
            {"server_started", #0, #-1, #-1, {}, "", #-1, "", "", #-1, "", #0.cb_owner, #-1, {}}
          };
        as: wizard
        expect: {value: 1}
      - restart_server: {reset_db: true}

  - name: startup_file_{outcome}_context_and_order
    table:
      columns: [outcome, tail]
      rows:
        - [return, "return 93;"]
        - [error, "raise(E_INVARG);"]
