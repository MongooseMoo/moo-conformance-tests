name: property_definition_anonymous_descendants
description: >
  add_property() and delete_property() on a parent reach the parent's
  anonymous children: the inherited slot appears on and disappears from the
  anonymous object exactly as it does on a permanent child. Rows cover one
  task and separate tasks (the anonymous child is held in a property of #0
  between steps), and an anonymous child that set its own value first.
setup:
  permission: wizard
  code: 'try delete_property(#0, "pdad_parent"); except (ANY) endtry

    try delete_property(#0, "pdad_anon"); except (ANY) endtry

    add_property(#0, "pdad_parent", #-1, {player, "rw"});

    add_property(#0, "pdad_anon", 0, {player, "rw"});

    '
teardown:
  permission: wizard
  code: '$pdad_anon = 0;

    try if (valid($pdad_parent)) recycle($pdad_parent); endif except (ANY) endtry

    delete_property(#0, "pdad_parent");

    delete_property(#0, "pdad_anon");

    '
tests:
  - name: delete_property_removes_slot_from_anonymous_child_same_task
    permission: wizard
    statement: |
      p = create($nothing);
      add_property(p, "x", 1, {player, "rw"});
      a = create(p, 1);
      before = a.x;
      delete_property(p, "x");
      after = `a.x ! ANY';
      recycle(p);
      return {before, after};
    expect:
      value: [1, E_PROPNF]

  - name: delete_property_removes_overridden_slot_from_anonymous_child_same_task
    permission: wizard
    statement: |
      p = create($nothing);
      add_property(p, "x", 1, {player, "rw"});
      a = create(p, 1);
      a.x = 7;
      before = a.x;
      delete_property(p, "x");
      after = `a.x ! ANY';
      recycle(p);
      return {before, after};
    expect:
      value: [7, E_PROPNF]

  - name: readded_property_on_parent_is_clear_on_anonymous_child_same_task
    permission: wizard
    statement: |
      p = create($nothing);
      add_property(p, "x", 1, {player, "rw"});
      a = create(p, 1);
      a.x = 7;
      delete_property(p, "x");
      add_property(p, "x", 9, {player, "rw"});
      r = {a.x, is_clear_property(a, "x")};
      recycle(p);
      return r;
    expect:
      value: [9, 1]

  - name: add_property_adds_clear_slot_to_anonymous_child_same_task
    permission: wizard
    statement: |
      p = create($nothing);
      a = create(p, 1);
      add_property(p, "y", 5, {player, "rw"});
      r = {a.y, is_clear_property(a, "y")};
      recycle(p);
      return r;
    expect:
      value: [5, 1]

  - name: delete_property_removes_slot_from_anonymous_child_separate_tasks
    permission: wizard
    steps:
      - run: |
          $pdad_anon = 0;
          if (valid($pdad_parent)) recycle($pdad_parent); endif
          $pdad_parent = create($nothing);
          add_property($pdad_parent, "x", 1, {player, "rw"});
          $pdad_anon = create($pdad_parent, 1);
          return $pdad_anon.x;
        as: wizard
        expect:
          value: 1
      - run: |
          delete_property($pdad_parent, "x");
          return 0;
        as: wizard
        expect:
          value: 0
      - run: |
          return `$pdad_anon.x ! ANY';
        as: wizard
        expect:
          value: E_PROPNF

  - name: delete_property_removes_overridden_slot_from_anonymous_child_separate_tasks
    permission: wizard
    steps:
      - run: |
          $pdad_anon = 0;
          if (valid($pdad_parent)) recycle($pdad_parent); endif
          $pdad_parent = create($nothing);
          add_property($pdad_parent, "x", 1, {player, "rw"});
          $pdad_anon = create($pdad_parent, 1);
          $pdad_anon.x = 7;
          return $pdad_anon.x;
        as: wizard
        expect:
          value: 7
      - run: |
          delete_property($pdad_parent, "x");
          return 0;
        as: wizard
        expect:
          value: 0
      - run: |
          return `$pdad_anon.x ! ANY';
        as: wizard
        expect:
          value: E_PROPNF

  - name: add_property_adds_clear_slot_to_anonymous_child_separate_tasks
    permission: wizard
    steps:
      - run: |
          $pdad_anon = 0;
          if (valid($pdad_parent)) recycle($pdad_parent); endif
          $pdad_parent = create($nothing);
          $pdad_anon = create($pdad_parent, 1);
          return 0;
        as: wizard
        expect:
          value: 0
      - run: |
          add_property($pdad_parent, "y", 5, {player, "rw"});
          return 0;
        as: wizard
        expect:
          value: 0
      - run: |
          return {$pdad_anon.y, is_clear_property($pdad_anon, "y")};
        as: wizard
        expect:
          value: [5, 1]
