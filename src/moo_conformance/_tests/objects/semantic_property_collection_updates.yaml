# Source: ToastStunt src/execute.cc OP_INDEXSET, EOP_RANGESET and OP_PUT_PROP;
# src/list.cc listset/listrangeset/strrangeset; src/map.cc mapinsert.
name: semantic_property_collection_updates
description: Collection writeback through property slots preserves saved values and other holders; failures preserve clear state.
requires:
  builtins: [create, recycle, add_property, equal, is_clear_property]
tests:
  - name: defining_slot_list_index
    description: "list index through a defining slot; observe writeback, alias isolation and clear state."
    permission: wizard
    statement: |
      p = create($nothing);
      add_property(p,"x",{1,2,3},{player,"rw"});
      c = create(p);
      sibling = create(p);
      try
        t = p;
        saved = t.x;
        before_clear = is_clear_property(t,"x");
        outcome = `t.x[2] = 9 ! ANY';
        outcome = typeof(outcome) == ERR ? outcome | "ok";
        return {before_clear, outcome, equal(t.x,{1,9,3}), equal(p.x,{1,9,3}),
                equal(sibling.x,{1,9,3}), equal(saved,{1,2,3}), is_clear_property(t,"x")};
      finally
        recycle(sibling); recycle(c); recycle(p);
      endtry
    expect:
      value: [0,"ok",1,1,1,1,0]

