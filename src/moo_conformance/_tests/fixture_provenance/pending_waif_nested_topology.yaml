name: fixture_provenance_pending_waif_nested_topology
description: Rebuilds the nested-WAIF fixture from its pinned Toast startup recipe.
server_db: RecipePendingWaifNestedTopology.db
requires:
  config: [managed_server, server_dir, server_db_dir]
tests:
  - name: nested_waif_recipe_output_matches_checked_in_fixture_bytes
    steps:
      - wait_for_server_exit: {timeout_ms: 5000, exit_code: 0}
      - assert_file:
          path: RecipePendingWaifNestedTopology.db.new
          equals_file: PendingWaifNestedTopology.db
          timeout_ms: 1000
