name: exec_call_shapes
description: Arguments, path failures, and process I/O for exec().

requires:
  builtins:
    - exec
  features:
    - exec_support

tests:
  - name: exec_three_arguments_rejects_missing_command
    permission: wizard
    statement: |
      try
        exec({"no-such-program"}, "", {});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Does not exist", 0]

  - name: exec_fails_for_non_wizards
    permission: programmer
    code: exec({"foobar"})
    expect:
      error: E_PERM
  - name: exec_fails_for_nonexistent_executables
    permission: wizard
    statement: |
      try
        exec({"no-such-program"});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Does not exist", 0]
  - name: exec_fails_for_absolute_paths
    permission: wizard
    statement: |
      try
        exec({"/test_io"});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Invalid path", 0]
  - name: exec_fails_for_dot_slash_paths
    permission: wizard
    statement: |
      try
        exec({"./test_io"});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Invalid path", 0]
  - name: exec_fails_for_parent_dir_paths
    permission: wizard
    statement: |
      try
        exec({"../test_io"});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Invalid path", 0]
  - name: exec_fails_for_path_traversal
    permission: wizard
    statement: |
      try
        exec({"foo/../../test_io"});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Invalid path", 0]
  - name: exec_fails_for_empty_program_name
    permission: wizard
    statement: |
      try
        exec({""});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Invalid path", 0]
  - name: exec_fails_for_directory
    permission: wizard
    statement: |
      try
        exec({"."});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Is not a file", 0]
  - name: exec_io_works
    permission: wizard
    code: exec({"test_io"}, "Hello, world!")
    expect:
      value:
      - 0
      - Hello, world!
      - Hello, world!
  - name: exec_args_works
    permission: wizard
    code: exec({"test_args", "one", "two", "three"}, "")
    expect:
      value:
      - 0
      - one two three
      - ''
  - name: exec_exit_status_works
    permission: wizard
    code: exec({"test_exit_status", "2"}, "")
    expect:
      value:
      - 2
      - ''
      - ''
  - name: exec_with_sleep_works
    permission: wizard
    code: exec({"test_with_sleep"}, "")
    expect:
      value:
      - 0
      - 1~0A2~0A3~0A
      - ''
  - name: exec_rejects_invalid_binary_string
    permission: wizard
    code: exec({"test_io"}, "1~ZZ23~0A")
    expect:
      error: E_INVARG
