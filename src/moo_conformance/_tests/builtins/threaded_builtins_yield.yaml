name: threaded_builtins_yield
description: >
  sort(), all_members() and curl() are threaded builtins. While the calling
  activation's thread mode is on (the default), each call suspends the task
  and runs the work in the background, so every call is a point where other
  tasks run. The task then resumes as a background task with a fresh
  bg_ticks/bg_seconds budget. With set_thread_mode(0) the work runs inline:
  the task does not suspend and its budget carries on. A thread's error result
  is raised when the task resumes; an inline call returns it as a value.
  Oracle: ToastStunt background_thread() (background.cc), bf_sort and
  bf_all_members (list.cc), bf_curl (curl.cc), and resume_from_previous_vm()
  (execute.cc), which re-enters run_interpreter() with background limits.

tests:
  - name: sort_resets_budget_to_background_limits
    description: >
      An eval starts with the foreground budget (60000 ticks, 5 seconds).
      Even sort({}) suspends, and the task resumes with the background budget
      (30000 ticks, 3 seconds).
    permission: wizard
    statement: |
      ticks = ticks_left();
      seconds = seconds_left();
      sort({});
      after_ticks = ticks_left();
      return {ticks > 30000, after_ticks <= 30000 && after_ticks > 29000, seconds > 3, seconds_left() <= 3};
    expect:
      value: [1, 1, 1, 1]

  - name: all_members_resets_budget_to_background_limits
    description: all_members() suspends like sort(), even on an empty list.
    permission: wizard
    statement: |
      ticks = ticks_left();
      seconds = seconds_left();
      all_members(1, {});
      after_ticks = ticks_left();
      return {ticks > 30000, after_ticks <= 30000 && after_ticks > 29000, seconds > 3, seconds_left() <= 3};
    expect:
      value: [1, 1, 1, 1]

  - name: sort_unthreaded_keeps_budget
    description: With set_thread_mode(0), sort() runs inline and the tick budget is not reset.
    permission: wizard
    statement: |
      set_thread_mode(0);
      ticks = ticks_left();
      sort({3, 1, 2});
      return {ticks > 30000, ticks - ticks_left() < 100};
    expect:
      value: [1, 1]

  - name: all_members_unthreaded_keeps_budget
    description: With set_thread_mode(0), all_members() runs inline and the tick budget is not reset.
    permission: wizard
    statement: |
      set_thread_mode(0);
      ticks = ticks_left();
      all_members(1, {1, 2, 1});
      return {ticks > 30000, ticks - ticks_left() < 100};
    expect:
      value: [1, 1]

  - name: sort_lets_forked_task_run_during_call
    description: >
      A zero-delay fork cannot run until its parent stops running. A threaded
      sort() stops the parent: the child runs while the sort is in the
      background, and the parent sees the child's write after sort() returns.
      The sort (32768 128-character strings, natural order) keeps the thread
      busy for tens of milliseconds, long enough for the child to be
      scheduled first.
    timeout_ms: 15000
    steps:
      - run: |
          try
            add_property(#0, "threaded_yield_mark", "unset", {player, "rw"});
          except (E_INVARG)
          endtry
          return 1;
        as: wizard
      - run: |
          s = "a";
          for i in [1..7]
            s = s + s;
          endfor
          l = {s};
          for i in [1..15]
            l = {@l, @l};
          endfor
          fork (0)
            #0.threaded_yield_mark = "child";
          endfork
          #0.threaded_yield_mark = "parent";
          sorted = sort(l, {}, 1);
          return {length(sorted), #0.threaded_yield_mark};
        as: wizard
        expect:
          value: [32768, "child"]
    cleanup:
      - run: 'delete_property(#0, "threaded_yield_mark");'
        as: wizard

  - name: sort_unthreaded_does_not_let_forked_task_run
    description: >
      With set_thread_mode(0), sort() does not stop the parent, so a
      zero-delay fork child has not run by the time sort() returns.
    permission: wizard
    statement: |
      try
        add_property(#0, "threaded_yield_mark", "unset", {player, "rw"});
      except (E_INVARG)
      endtry
      set_thread_mode(0);
      fork (0)
        #0.threaded_yield_mark = "child";
      endfork
      #0.threaded_yield_mark = "parent";
      sort({3, 1, 2});
      return #0.threaded_yield_mark;
    teardown:
      permission: wizard
      code: 'delete_property(#0, "threaded_yield_mark")'
    expect:
      value: "parent"

  - name: all_members_unthreaded_does_not_let_forked_task_run
    description: With set_thread_mode(0), all_members() does not stop the parent either.
    permission: wizard
    statement: |
      try
        add_property(#0, "threaded_yield_mark", "unset", {player, "rw"});
      except (E_INVARG)
      endtry
      set_thread_mode(0);
      fork (0)
        #0.threaded_yield_mark = "child";
      endfork
      #0.threaded_yield_mark = "parent";
      all_members(1, {1, 2, 1});
      return #0.threaded_yield_mark;
    teardown:
      permission: wizard
      code: 'delete_property(#0, "threaded_yield_mark")'
    expect:
      value: "parent"

  - name: sort_element_type_error_raises_when_threaded
    description: A mixed-type list fails in the sort thread, and the error is raised when the task resumes.
    permission: wizard
    statement: |
      try
        return {"value", sort({1, "a"})};
      except e (ANY)
        return {"raised", e[1]};
      endtry
    expect:
      value: ["raised", E_TYPE]

  - name: sort_element_type_error_is_returned_when_unthreaded
    description: The same failure in an inline sort() is returned as the call's value, not raised.
    permission: wizard
    statement: |
      set_thread_mode(0);
      try
        return {"value", sort({1, "a"})};
      except e (ANY)
        return {"raised", e[1]};
      endtry
    expect:
      value: ["value", E_TYPE]

  - name: sort_key_length_error_raises_when_threaded
    description: A key list of the wrong length fails in the sort thread with E_INVARG, raised on resume.
    permission: wizard
    statement: |
      try
        return {"value", sort({1, 2}, {1})};
      except e (ANY)
        return {"raised", e[1]};
      endtry
    expect:
      value: ["raised", E_INVARG]

  - name: sort_key_length_error_is_returned_when_unthreaded
    description: The same E_INVARG from an inline sort() is returned as the call's value.
    permission: wizard
    statement: |
      set_thread_mode(0);
      try
        return {"value", sort({1, 2}, {1})};
      except e (ANY)
        return {"raised", e[1]};
      endtry
    expect:
      value: ["value", E_INVARG]

  - name: sort_argument_type_error_raises_when_unthreaded
    description: Argument type checks happen before the thread decision, so they raise in either mode.
    permission: wizard
    statement: |
      set_thread_mode(0);
      try
        return {"value", sort({1, 2}, 1)};
      except e (ANY)
        return {"raised", e[1]};
      endtry
    expect:
      value: ["raised", E_TYPE]

  - name: curl_resets_budget_to_background_limits
    description: >
      curl() suspends like sort(). A file: URL is refused by the transfer
      itself, so no network is involved; the call still resumes with the
      background budget and returns the error map.
    skip_if: "missing builtin.curl or not option.OUTBOUND_NETWORK"
    permission: wizard
    statement: |
      ticks = ticks_left();
      result = curl("file:///etc/passwd", 0, 1);
      after_ticks = ticks_left();
      return {typeof(result) == MAP, ticks > 30000, after_ticks <= 30000 && after_ticks > 29000};
    expect:
      value: [1, 1, 1]

  - name: curl_unthreaded_keeps_budget
    description: With set_thread_mode(0), curl() runs inline and the tick budget is not reset.
    skip_if: "missing builtin.curl or not option.OUTBOUND_NETWORK"
    permission: wizard
    statement: |
      set_thread_mode(0);
      ticks = ticks_left();
      result = curl("file:///etc/passwd", 0, 1);
      return {typeof(result) == MAP, ticks > 30000, ticks - ticks_left() < 100};
    expect:
      value: [1, 1, 1]
