  - name: listappend_past_limit_aborts_when_not_catchable
    description: listappend() past max_list_value_bytes aborts the task (make_space_pack).
    steps:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          #0.concat_abort_mark = "started";
          r = {};
          try
          try
            for i in [1..1000]
              r = listappend(r, i);
            endfor
            #0.concat_abort_mark = "completed";
            return length(r);
          except e (ANY)
            #0.concat_abort_mark = "caught";
            return {"raised", e[1]};
          endtry
          finally
            #0.concat_abort_mark = "finally";
          endtry
        as: wizard
        expect:
          match: "Task ran out of seconds"
      - run: "return #0.concat_abort_mark;"
        as: wizard
        expect:
          value: started
    cleanup:
      - run: |
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

  - name: listappend_past_limit_raises_when_catchable
    description: With max_concat_catchable true listappend() past max_list_value_bytes raises E_QUOTA.
    steps:
      - run: |
          $server_options.max_concat_catchable = 1;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          r = {};
          try
            for i in [1..1000]
              r = listappend(r, i);
            endfor
            return length(r);
          except e (ANY)
            return {"raised", e[1]};
          endtry
        as: wizard
        expect:
          value: ["raised", "E_QUOTA"]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

  - name: tostr_past_limit_aborts_when_not_catchable
    description: tostr() building a string past max_string_concat aborts the task (make_space_pack).
    steps:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_string_concat = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          #0.concat_abort_mark = "started";
          s = "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789";
          try
          try
            r = tostr(s, s, s, s, s, s, s, s, s, s, s, s, s, s, s);
            #0.concat_abort_mark = "completed";
            return length(r);
          except e (ANY)
            #0.concat_abort_mark = "caught";
            return {"raised", e[1]};
          endtry
          finally
            #0.concat_abort_mark = "finally";
          endtry
        as: wizard
        expect:
          match: "Task ran out of seconds"
      - run: "return #0.concat_abort_mark;"
        as: wizard
        expect:
          value: started
    cleanup:
      - run: |
          $server_options.max_string_concat = 1000000;
          load_server_options();
        as: wizard

  - name: tostr_past_limit_raises_when_catchable
    description: With max_concat_catchable true tostr() past max_string_concat raises E_QUOTA.
    steps:
      - run: |
          $server_options.max_concat_catchable = 1;
          $server_options.max_string_concat = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          s = "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789";
          try
            return length(tostr(s, s, s, s, s, s, s, s, s, s, s, s, s, s, s));
          except e (ANY)
            return {"raised", e[1]};
          endtry
        as: wizard
        expect:
          value: ["raised", "E_QUOTA"]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_string_concat = 1000000;
          load_server_options();
        as: wizard

  - name: unset_option_aborts_like_false
    description: With max_concat_catchable not defined on $server_options the limit aborts the task (the option defaults to 0).
    steps:
      - run: |
          delete_property($server_options, "max_concat_catchable");
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          r = {};
          try
            for i in [1..1000]
              r = {@r, i};
            endfor
            return length(r);
          except e (ANY)
            return {"raised", e[1]};
          endtry
        as: wizard
        expect:
          match: "Task ran out of seconds"
    cleanup:
      - run: |
          add_property($server_options, "max_concat_catchable", 0, {player, "r"});
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

  - name: limit_aborts_in_verb_without_debug_flag
    description: A verb without the d flag still aborts; the limit never becomes a pushed E_QUOTA value.
    steps:
      - run: |
          o = create(#1);
          add_verb(o, {player, "rx", "grow"}, {"this", "none", "this"});
          set_verb_code(o, "grow", {"r = {};", "for i in [1..1000]", "r = {@r, i};", "endfor", "return {\"completed\", r};"});
          #0.concat_abort_mark = o;
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: "return #0.concat_abort_mark:grow();"
        as: wizard
        expect:
          match: "Task ran out of seconds"
    cleanup:
      - run: |
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
          if (typeof(#0.concat_abort_mark) == OBJ && valid(#0.concat_abort_mark))
            recycle(#0.concat_abort_mark);
          endif
          #0.concat_abort_mark = 0;
        as: wizard

  - name: limit_abort_calls_handle_task_timeout_with_seconds
    description: The abort is an out-of-seconds abort; #0:handle_task_timeout gets "seconds" and a "Task ran out of seconds" traceback.
    steps:
      - run: |
          add_property(#0, "concat_abort_saved", {}, {#0, "rw"});
          old_exists = 1;
          try
            old_info = verb_info(#0, "handle_task_timeout");
            old_args = verb_args(#0, "handle_task_timeout");
            old_code = verb_code(#0, "handle_task_timeout");
          except (E_VERBNF)
            old_exists = 0;
            old_info = {};
            old_args = {};
            old_code = {};
          endtry
          #0.concat_abort_saved = {old_exists, old_info, old_args, old_code};
          if (!old_exists)
            add_verb(#0, {#0, "rxd", "handle_task_timeout"}, {"this", "none", "this"});
          endif
          set_verb_info(#0, "handle_task_timeout", {#0, "rxd", "handle_task_timeout"});
          set_verb_args(#0, "handle_task_timeout", {"this", "none", "this"});
          set_verb_code(#0, "handle_task_timeout", {
            "#0.concat_abort_mark = {args[1], typeof(args[2]) == LIST, index(args[3][1], \"Task ran out of seconds\") != 0};",
            "return 1;"
          });
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          #0.concat_abort_mark = {};
          fork (0)
            r = {};
            try
              for i in [1..1000]
                r = {@r, i};
              endfor
            except (ANY)
              #0.concat_abort_mark = "caught";
            endtry
          endfork
          suspend(1);
          return #0.concat_abort_mark;
        as: wizard
        expect:
          value: ["seconds", 1, 1]
    cleanup:
      - run: |
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
          try
            saved = #0.concat_abort_saved;
            if (saved[1])
              set_verb_info(#0, "handle_task_timeout", saved[2]);
              set_verb_args(#0, "handle_task_timeout", saved[3]);
              set_verb_code(#0, "handle_task_timeout", saved[4]);
            else
              delete_verb(#0, "handle_task_timeout");
            endif
          except (ANY)
          endtry
          try
            delete_property(#0, "concat_abort_saved");
          except (ANY)
          endtry
        as: wizard
