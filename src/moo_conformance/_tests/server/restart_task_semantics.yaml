name: restart_task_semantics
description: Checkpointed tasks across a restart - indefinite suspension and order relative to server_started.

requires:
  builtins:
    - add_property
    - add_verb
    - delete_verb
    - set_verb_code
    - create
    - dump_database
    - suspend
    - queued_tasks

tests:
  - name: indefinitely_suspended_task_across_checkpoint_restart
    description: >
      A task suspended with no timeout stays suspended across a checkpoint restart: after
      load it is still queued and has not resumed.
    steps:
      - restart_server: {reset_db: true}
      - run: |
          obj = create($nothing);
          add_property(obj, "resumed", {}, {player, "rw"});
          add_verb(obj, {player, "xd", "hold"}, {"this", "none", "this"});
          set_verb_code(obj, "hold", {
            "fork id (0)",
            "  v = suspend();",
            "  this.resumed = {v};",
            "endfork",
            "suspend(0);",
            "return id;"
          });
          return obj;
        capture: indefinite_obj
        as: wizard
      - run: "return {indefinite_obj}:hold();"
        capture: indefinite_id
        as: wizard
      - run: "return dump_database();"
        as: wizard
        expect:
          value: 0
      - restart_server:
          checkpoint_timeout_ms: 10000
          wait_ms: 300
      - wait: 1000
      - run: |
          still_queued = 0;
          for queued in (queued_tasks())
            if (queued[1] == {indefinite_id})
              still_queued = 1;
            endif
          endfor
          return {{indefinite_obj}.resumed, still_queued};
        as: wizard
        expect:
          value: [[], 1]
      - restart_server: {reset_db: true}

  - name: restored_overdue_fork_runs_after_server_started_returns
    description: >
      A queued fork that is overdue when the checkpoint loads runs only after
      server_started has returned, even when server_started does work first.
    steps:
      - restart_server: {reset_db: true}
      - run: |
          add_property(#0, "restore_order", {}, {player, "rw"});
          try delete_verb(#0, "server_started"); except (E_VERBNF) endtry
          add_verb(#0, {player, "rxd", "server_started"}, {"this", "none", "this"});
          set_verb_code(#0, "server_started", {
            "for i in [1..3000]",
            "endfor",
            "#0.restore_order = {@#0.restore_order, \"started\"};"
          });
          fork (5)
            #0.restore_order = {@#0.restore_order, "task"};
          endfork
          return 1;
        as: wizard
        expect:
          value: 1
      - run: "return dump_database();"
        as: wizard
        expect:
          value: 0
      - restart_server:
          checkpoint_timeout_ms: 10000
          down_ms: 6000
      - run: "return #0.restore_order;"
        as: wizard
        expect:
          value: ["started", "task"]
        poll_ms: 10000
      - restart_server: {reset_db: true}
