name: limits_concat_catchable
description: >
  $server_options.max_concat_catchable decides what a size limit does. With
  the option false, a value growing past max_string_concat,
  max_list_value_bytes or max_map_value_bytes aborts the task as out of
  seconds (execute.cc PUSH_ERROR_UNLESS_QUOTA, list.cc make_space_pack): no
  except or finally runs and the player gets the "Task ran out of seconds"
  traceback. With the option true the same growth raises a catchable E_QUOTA.

requires:
  builtins: [add_property, delete_property, load_server_options, listappend, tostr, add_verb, set_verb_code, create, recycle]

setup:
  permission: wizard
  code: |
    add_property($server_options, "max_concat_catchable", 0, {player, "r"});
    add_property($server_options, "max_string_concat", 1000000, {player, "r"});
    add_property($server_options, "max_list_value_bytes", 1000000, {player, "r"});
    add_property($server_options, "max_map_value_bytes", 1000000, {player, "r"});
    add_property(#0, "concat_abort_mark", 0, {player, "rw"});
    load_server_options();

teardown:
  permission: wizard
  code: |
    delete_property($server_options, "max_concat_catchable");
    delete_property($server_options, "max_string_concat");
    delete_property($server_options, "max_list_value_bytes");
    delete_property($server_options, "max_map_value_bytes");
    delete_property(#0, "concat_abort_mark");
    load_server_options();

tests:
  - name: list_splice_past_limit_aborts_when_not_catchable
    description: The barn #1089 reproducer; `{@r, i}` past max_list_value_bytes aborts, skipping except and finally.
    steps:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          #0.concat_abort_mark = "started";
          r = {};
          try
          try
            for i in [1..1000]
              r = {@r, i};
            endfor
            #0.concat_abort_mark = "completed";
            return length(r);
          except e (ANY)
            #0.concat_abort_mark = "caught";
            return {"raised", e[1]};
          endtry
          finally
            #0.concat_abort_mark = "finally";
          endtry
        as: wizard
        expect:
          match: "Task ran out of seconds"
      - run: "return #0.concat_abort_mark;"
        as: wizard
        expect:
          value: started
    cleanup:
      - run: |
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

  - name: list_splice_past_limit_raises_when_catchable
    description: With max_concat_catchable true the same splice raises a catchable E_QUOTA.
    steps:
      - run: |
          $server_options.max_concat_catchable = 1;
          $server_options.max_list_value_bytes = 1100;
          load_server_options();
          return 1;
        as: wizard
      - run: |
          r = {};
          try
            for i in [1..1000]
              r = {@r, i};
            endfor
            return length(r);
          except e (ANY)
            return {"raised", e[1]};
          endtry
        as: wizard
        expect:
          value: ["raised", "E_QUOTA"]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_list_value_bytes = 1000000;
          load_server_options();
        as: wizard

  - name: string_concat_past_limit_aborts_when_not_catchable
