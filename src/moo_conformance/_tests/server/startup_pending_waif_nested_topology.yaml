name: startup_pending_waif_nested_topology
description: Verifies a nested WAIF remains inside its one direct pending-finalization root.
server_db: PendingWaifNestedTopology.db
requires:
  config:
    - managed_server
    - server_dir
    - log_file
    - server_db_dir
tests:
  - name: nested_waif_is_not_promoted_to_a_second_top_level_pending_root
    steps:
      - wait: 1500
      - assert_log:
          contains: "ORACLE NESTED PENDING SHUTDOWN ENTERED"
      - assert_log:
          contains: "ORACLE NESTED PENDING SHUTDOWN RETURNED"
      - assert_file:
          path: PendingWaifNestedTopology.db.new
          contains: "1 values pending finalization"
      - assert_file:
          path: PendingWaifNestedTopology.db.new
          contains: |-
            13
            c 0
            9
            8
            1
            0
            13
            c 1
