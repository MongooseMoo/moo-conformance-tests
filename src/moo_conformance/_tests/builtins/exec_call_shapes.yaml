name: exec_call_shapes
description: Call-shape coverage for exec().

requires:
  builtins:
    - exec
  features:
    - exec_support

tests:
  - name: exec_three_arguments_rejects_missing_command
    permission: wizard
    statement: |
      try
        exec({"no-such-program"}, "", {});
      except e (E_INVARG)
        return e[1..3];
      endtry
    expect:
      value: [E_INVARG, "Does not exist", 0]
