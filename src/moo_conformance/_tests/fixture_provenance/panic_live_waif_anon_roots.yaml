name: fixture_provenance_panic_live_waif_anon_roots
description: Rebuilds the panic-root fixture from its pinned Toast startup recipe.
server_db: RecipePanicLiveWaifAnonRoots.db
requires:
  config: [managed_server, server_dir, server_db_dir]
tests:
  - name: panic_root_recipe_output_matches_checked_in_fixture_bytes
    steps:
      - wait_for_server_exit: {timeout_ms: 5000, exit_code: 0}
      - assert_file:
          path: RecipePanicLiveWaifAnonRoots.db.new
          equals_file: PanicLiveWaifAnonRoots.db
          timeout_ms: 1000
