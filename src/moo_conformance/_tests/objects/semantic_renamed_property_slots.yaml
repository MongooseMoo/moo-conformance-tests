# Source: ToastStunt src/property.cc set_prop_info; src/db_properties.cc
# db_rename_propdef, db_find_property and chparent property-slot reconstruction.
name: semantic_renamed_property_slots
description: Rename a definition with live inherited slots before a second mutation and observe values and metadata.
requires:
  builtins: [create, recycle, add_property, set_property_info, property_info, properties, delete_property, clear_property, is_clear_property, chparent]
tests:
  - name: clear_child_rename_twice
    description: "rename twice after renaming a definition; observe a clear child."
    permission: wizard
    statement: |
      p = create($nothing);
      add_property(p,"y",20,{player,"rw"});
      add_property(p,"x",10,{player,"rw"});
      c = create(p);
      g = create(c);
      q = $nothing;
      try
        t = c;
        saved = t.x;
        set_property_info(p,"x",{player,"rw","renamed"});
        before = {t.renamed, is_clear_property(t,"renamed"), `t.x ! ANY'};
        set_property_info(p,"renamed",{player,"rw","final"});
        return {saved, before, {t.final, `t.renamed ! ANY', is_clear_property(t,"final")}};
      finally
        recycle(g); recycle(c);
        if (valid(q)) recycle(q); endif
        recycle(p);
      endtry
    expect:
      value: [10,[10,1,"E_PROPNF"],[10,"E_PROPNF",1]]

