name: math_displayed_digits
description: >
  Displayed digits (tostr, 15 significant digits) of exp, sin, cos, tan,
  asin, acos, log, log10, sinh and cosh on ordinary arguments. Each expected
  value was observed on the stock WSL Toast oracle, and Toast's double is
  the correctly rounded one: e^x, sin x, ... computed with mpmath at 300 and
  600 bits round to it, and the exact value lies within 0.2 ulp of it, so
  a C library accurate to better than 0.7 ulp returns the same double.

requires:
  builtins:
    - exp
    - sin
    - cos
    - tan
    - asin
    - acos
    - log
    - log10
    - sinh
    - cosh
    - tostr

tests:
  - name: exp_digits_neg322_95841334865287
    code: "tostr(exp(-322.95841334865287))"
    expect:
      value: "5.50735660756797e-141"

  - name: exp_digits_neg598_6806734537115
    code: "tostr(exp(-598.6806734537115))"
    expect:
      value: "9.9148716587174e-261"

