  - name: mathfunc_cosh_overflow_just_past_threshold
    code: "cosh(710.48)"
    expect:
      error: E_FLOAT

  - name: mathfunc_cosh_overflow_negative_past_threshold
    code: "cosh(-711.0)"
    expect:
      error: E_FLOAT

  - name: mathfunc_cosh_finite_below_overflow_threshold
    code: "cosh(710.4)"
    expect:
      value: 1.66636428328065e+308

  - name: mathfunc_cosh_finite_above_exp_overflow
    code: "cosh(709.78)"
    expect:
      value: 8.96411397197258e+307

  - name: mathfunc_cosh_negative_twenty_five
    code: "cosh(-25.0)"
