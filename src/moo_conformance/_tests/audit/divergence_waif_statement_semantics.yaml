name: divergence_waif_statement_semantics
description: >
  Waif lifecycle/dispatch semantics (per ToastStunt waif model: ':'-prefixed
  class properties and verbs) and statement-level semantics found by
  differential probing (2026-08-30 campaign, batch 7). Expectations are stock
  WSL Toast behavior.

tests:
  - name: rangeset_zero_zero_prepends
    description: x[0..0] = {9} on a list prepends instead of raising E_RANGE.
    steps:
      - run: |
          x = {1, 2, 3};
          x[0..0] = {9};
          return x;
        as: wizard
        expect:
          value: [9, 1, 2, 3]

  - name: finally_return_overrides_try_return
    steps:
      - run: |
          try
            return 1;
          finally
            return 2;
          endtry
        as: wizard
        expect:
          value: 2

  - name: eval_supports_fork_statement
    permission: wizard
    code: "eval(\"fork (0) endfork return 1;\") == {1, 1}"
    expect:
      value: 1

  - name: waif_typeof_and_invalid
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          r = {typeof(w) == WAIF, valid(w)};
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [1, 0]

  - name: waif_parents_is_invarg
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          try
            return parents(w);
          finally
            recycle(c);
          endtry
        as: wizard
        expect:
          error: E_INVARG

  - name: waif_is_player_is_type_error
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          try
            return is_player(w);
          finally
            recycle(c);
          endtry
        as: wizard
        expect:
          error: E_TYPE

  - name: waif_owner_is_creator_and_immutable
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          own = w.owner == player;
          e = `w.owner = $nothing ! ANY';
          r = {own, toliteral(e)};
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [1, "E_PERM"]

  - name: waif_class_property_readable_through_waif
    steps:
      - run: |
          c = create($nothing);
          add_property(c, ":wp", 123, {player, ""});
          add_property(c, "plain", "wxyz", {player, ""});
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          r = {w.wp, toliteral(`w.plain ! ANY'), w.class == c, w.class.plain};
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [123, "E_PROPNF", 1, "wxyz"]

  - name: waif_class_property_inherited_from_ancestor
    steps:
      - run: |
          gp = create($nothing);
          add_property(gp, ":wp2", "inherited", {player, ""});
          c = create(gp);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          r = w.wp2;
          recycle(c);
          recycle(gp);
          return r;
        as: wizard
        expect:
          value: "inherited"

  - name: waif_property_assignment_stays_on_waif
    steps:
      - run: |
          c = create($nothing);
          add_property(c, ":wp3", 1, {player, ""});
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          w2 = c:new();
          w.wp3 = 99;
          r = {w.wp3, w2.wp3, c.(":wp3")};
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [99, 1, 1]

  - name: waif_verb_dispatch_uses_colon_verbs
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", ":greet"}, {"this", "none", "this"});
          set_verb_code(c, ":greet", {"return {typeof(this) == WAIF, \"hi\"};"});
          add_verb(c, {player, "xd", "plainverb"}, {"this", "none", "this"});
          set_verb_code(c, "plainverb", {"return \"plain\";"});
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          r = {w:greet(), toliteral(`w:plainverb() ! ANY'), w.class:plainverb()};
          recycle(c);
          return r;
        as: wizard
        expect:
          value:
            - [1, "hi"]
            - "E_VERBNF"
            - "plain"

  - name: waif_recycle_verb_called_on_release
    steps:
      - run: |
          try
            add_property(#0, "dwf_log", {}, {#0, "rw"});
          except (E_INVARG)
          endtry
          #0.dwf_log = {};
          c = create($nothing);
          add_verb(c, {player, "xd", ":recycle"}, {"this", "none", "this"});
          set_verb_code(c, ":recycle", {"#0.dwf_log = {@#0.dwf_log, typeof(this) == WAIF};"});
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          w = 0;
          suspend(0);
          r = #0.dwf_log;
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [1]
    cleanup:
      - run: |
          try
            delete_property(#0, "dwf_log");
          except (ANY)
          endtry
          return 0;
        as: wizard

  - name: waif_map_key_allowed_and_literal_shape
    description: A waif can be a map key; toliteral renders "[[class = #N, owner = #N]]".
    steps:
      - run: |
          c = create($nothing);
          add_verb(c, {player, "xd", "new"}, {"this", "none", "this"});
          set_verb_code(c, "new", {"return new_waif();"});
          w = c:new();
          m = `[w -> 1] ! ANY';
          lit = toliteral(w) == "[[class = " + toliteral(c) + ", owner = " + toliteral(player) + "]]";
          r = {typeof(m) == MAP, lit};
          recycle(c);
          return r;
        as: wizard
        expect:
          value: [1, 1]
