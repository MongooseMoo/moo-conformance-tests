name: persistent_walking_skeleton
description: >
  Proves the minimum persistent production path from login and evaluation
  through checkpoint, process restart, reconnect, and evaluation.
requires:
  builtins:
    - dump_database
  config: [managed_server]
tests:
  - name: boot_login_eval_checkpoint_restart_eval
    permission: wizard
    steps:
      - run: "return 6 * 7;"
        expect:
          value: 42
      - run: "return dump_database();"
        expect:
          value: 0
      - wait: 1500
      - restart_server:
          wait_ms: 300
      - run: "return 40 + 2;"
        expect:
          value: 42
