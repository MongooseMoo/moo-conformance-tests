name: task_local
description: Tests for task_local() and set_task_local() builtins

requires:
  builtins:
    - task_local
    - set_task_local
    - task_id
    - suspend
    - fork
    - resume
    - kill_task
    - create
    - recycle
    - add_verb
    - set_verb_code
    - add_property
    - delete_property
    - valid
    - notify
    - tostr
  features: [tasks]

tests:
  # Permission tests
  - name: set_task_local_requires_wizard
    permission: programmer
    code: "set_task_local(1)"
    expect:
      error: E_PERM

  - name: task_local_requires_wizard
    permission: programmer
    code: "task_local()"
    expect:
      error: E_PERM

  # Argument checking
  - name: set_task_local_no_args
    permission: wizard
    code: "set_task_local()"
    expect:
      error: E_ARGS

  - name: set_task_local_too_many_args
    permission: wizard
    code: "set_task_local(1, 2, 3)"
    expect:
      error: E_ARGS

  - name: set_task_local_one_arg
    permission: wizard
    code: 'set_task_local("1")'
    expect:
      value: 0

  - name: task_local_takes_no_args
    permission: wizard
    code: "task_local({})"
    expect:
      error: E_ARGS

  - name: task_local_no_args
    permission: wizard
    code: "task_local()"
    expect:
      value: {}

  # Basic functionality
  - name: simple_eval_case
    permission: wizard
    statement: |
      set_task_local({"foo", "bar", 1, 2, 3});
      return task_local();
    expect:
      value: ["foo", "bar", 1, 2, 3]

  # Error handling
  - name: eval_case_with_error
    permission: wizard
    statement: |
      set_task_local({"foo", "bar", 1, 2, 3});
      1 / 0;
      return task_local();
    expect:
      error: E_DIV

  # These tests require full server support (suspend/fork/resume/verb calls)
  # and cannot be easily translated to simple eval tests

  - name: eval_case_with_suspend
    permission: wizard
    statement: |
      set_task_local({"foo", "bar", 2, 3, 4});
      suspend(1);
      return task_local();
    expect:
      value: ["foo", "bar", 2, 3, 4]

  - name: fork_and_suspend_case
    permission: wizard
    statement: |
      set_task_local({1, 2});
      id = task_id();
      fork (1)
        set_task_local({"foo", "bar", 3, 4, 5});
        suspend(1);
        resume(id, task_local());
      endfork
      return {task_local(), suspend()};
    expect:
      value: [[1, 2], ["foo", "bar", 3, 4, 5]]

  - name: suspend_case_with_error
    permission: wizard
    statement: |
      set_task_local({"foo", "bar", 2, 3, 4});
      suspend(1);
      1 / 0;
      return task_local();
    expect:
      error: E_DIV

  - name: fork_suspend_case_with_error
    permission: wizard
    statement: |
      set_task_local({1, 2});
      id = task_id();
      fork (1)
        set_task_local({"foo", "bar", 3, 4, 5});
        suspend(1);
        resume(id, task_local());
      endfork
      suspend();
      1 / 0;
      return {task_local()};
    expect:
      error: E_DIV

  # Verb call tests
  - name: command_verb
    permission: wizard
    steps:
      - run: "create($nothing)"
        capture: obj
      - verb_setup:
          object: "{obj}"
          name: "foo"
          args: ["any", "any", "any"]
          code: |
            set_task_local({argstr});
            this:bar();
      - verb_setup:
          object: "{obj}"
          name: "bar"
          args: ["this", "none", "this"]
          code: 'notify(player, tostr(task_local() == {tostr(this) + " to the " + tostr(this)}));'
      - command: "foo {obj} to the {obj}"
        expect:
          output: "1"
    cleanup:
      - run: "if (valid({obj})) recycle({obj}); endif"

  - name: server_verb
    permission: wizard
    steps:
      - run: |
          try
            add_property(#0, "task_local_server_verb_marker", {}, {#0, "rw"});
          except (E_INVARG)
            #0.task_local_server_verb_marker = {};
          endtry
          return create($nothing);
        capture: obj
      - verb_setup:
          object: "{obj}"
          name: "recycle"
          args: ["this", "none", "this"]
          code: "this:bar();"
      - verb_setup:
          object: "{obj}"
          name: "bar"
          args: ["this", "none", "this"]
          code: "#0.task_local_server_verb_marker = task_local();"
      - run: |
          set_task_local({1, {2, {3}}});
          recycle({obj});
          return 0;
        expect:
          value: 0
      - run: "return #0.task_local_server_verb_marker;"
        expect:
          value: [1, [2, [3]]]
    cleanup:
      - run: |
          if (valid({obj}))
            recycle({obj});
          endif
          try
            delete_property(#0, "task_local_server_verb_marker");
          except (ANY)
          endtry

  - name: across_verb_calls
    permission: wizard
    steps:
      - run: "create($nothing)"
        capture: obj
      - verb_setup:
          object: "{obj}"
          name: "foo"
          args: ["this", "none", "this"]
          code: |
            {value} = args;
            set_task_local(value);
      - verb_setup:
          object: "{obj}"
          name: "bar"
          args: ["this", "none", "this"]
          code: "return task_local();"
      - run: "{obj}:foo(1.234); return {obj}:bar();"
        expect:
          value: 1.234
    cleanup:
      - run: "if (valid({obj})) recycle({obj}); endif"

  - name: across_verb_calls_with_intermediate
    permission: wizard
    steps:
      - run: "create($nothing)"
        capture: obj
      - verb_setup:
          object: "{obj}"
          name: "foo"
          args: ["this", "none", "this"]
          code: |
            {value} = args;
            set_task_local(value);
      - verb_setup:
          object: "{obj}"
          name: "bar"
          args: ["this", "none", "this"]
          code: "return task_local();"
      - verb_setup:
          object: "{obj}"
          name: "baz"
          args: ["this", "none", "this"]
          code: |
            {value} = args;
            this:foo(value);
            return this:bar();
      - run: "{obj}:baz(23.456)"
        expect:
          value: 23.456
    cleanup:
      - run: "if (valid({obj})) recycle({obj}); endif"

  - name: suspend_between_verb_calls
    permission: wizard
    steps:
      - run: "create($nothing)"
        capture: obj
      - verb_setup:
          object: "{obj}"
          name: "foo"
          args: ["this", "none", "this"]
          code: |
            {value} = args;
            set_task_local(value);
      - verb_setup:
          object: "{obj}"
          name: "bar"
          args: ["this", "none", "this"]
          code: "return task_local();"
      - verb_setup:
          object: "{obj}"
          name: "baz"
          args: ["this", "none", "this"]
          code: |
            {value} = args;
            this:foo(value);
            fork (0)
              for i in [1..10]
                suspend(1);
              endfor
            endfork
            total = 1.0;
            for i in [1..5]
              suspend(1);
              total = total * this:bar();
            endfor
            return total;
      - new_connection:
          capture: worker
      - send:
          connection: worker
          text: "connect wizard"
      - send:
          connection: worker
          text: "; return {obj}:baz(2.5);"
      - wait: 5500
      - read_connection:
          connection: worker
        expect:
          output:
            contains: "97.65625"
      - close_connection: worker
    cleanup:
      - run: "if (valid({obj})) recycle({obj}); endif"

  # Memory leak regression tests (non-functional)
  - name: nonfunctional_fork_suspend
    permission: wizard
    statement: |
      fork (0)
        suspend(0);
      endfork
    expect:
      value: 0

  - name: nonfunctional_kill_task
    permission: wizard
    steps:
      - run: |
          try
            add_property(#0, "task_local_self_kill_marker", "before", {#0, "rw"});
          except (E_INVARG)
            #0.task_local_self_kill_marker = "before";
          endtry
          return 1;
        expect:
          value: 1
      - new_connection:
          capture: victim
      - send:
          connection: victim
          text: "connect wizard"
      - send:
          connection: victim
          text: '; #0.task_local_self_kill_marker = "entered"; kill_task(task_id()); #0.task_local_self_kill_marker = "after";'
      - close_connection: victim
      - run: 'return #0.task_local_self_kill_marker;'
        expect:
          value: entered
    cleanup:
      - run: |
          try
            delete_property(#0, "task_local_self_kill_marker");
          except (ANY)
          endtry
