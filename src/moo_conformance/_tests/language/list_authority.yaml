name: list_authority
description: Toast-authoritative explicit LIST insertion-position boundaries.
requires:
  builtins:
    - listappend
    - listinsert

tests:
  - name: explicit_append_and_insert_positions_clamp
    code: |
      return {
        listappend({1, 2}, 3, -5),
        listappend({1, 2}, 3, 0),
        listappend({1, 2}, 3, 1),
        listappend({1, 2}, 3, 2),
        listappend({1, 2}, 3, 3),
        listappend({1, 2}, 3, 99),
        listinsert({1, 2}, 3, -5),
        listinsert({1, 2}, 3, 0),
        listinsert({1, 2}, 3, 1),
        listinsert({1, 2}, 3, 2),
        listinsert({1, 2}, 3, 3),
        listinsert({1, 2}, 3, 99)
      };
    expect:
      value:
        - [3, 1, 2]
        - [3, 1, 2]
        - [1, 3, 2]
        - [1, 2, 3]
        - [1, 2, 3]
        - [1, 2, 3]
        - [3, 1, 2]
        - [3, 1, 2]
        - [3, 1, 2]
        - [1, 3, 2]
        - [1, 2, 3]
        - [1, 2, 3]
