      - run: |
          s = "";
          try
            for i in [1..1000]
              s = s + "0123456789";
            endfor
            return length(s);
          except e (ANY)
            return {"raised", e[1], length(s)};
          endtry
        as: wizard
        expect:
          value: ["raised", "E_QUOTA", 1100]
    cleanup:
      - run: |
          $server_options.max_concat_catchable = 0;
          $server_options.max_string_concat = 1000000;
          load_server_options();
        as: wizard

  - name: map_indexset_past_limit_aborts_when_not_catchable
