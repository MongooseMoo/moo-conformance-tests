# Source: ToastStunt src/db_verbs.cc callable lookup and name/flag invalidation;
# src/verbs.cc setters; src/execute.cc activation program reference.
name: semantic_verb_mutation_dispatch
description: Warm successful and unsuccessful lookups before mutating definitions, then check every affected name.
requires:
  builtins: [create, recycle, add_verb, set_verb_code, set_verb_info, set_verb_args, delete_verb, chparent]
tests:
  - name: local_replace_called_program
    description: "replace called program; local distinguishes the callable lookup starting point."
    permission: wizard
    statement: |
      b = create($nothing);
      b2 = create($nothing);
      p = create(b);
      c = create(p);
      try
        add_verb(b,{player,"rxd","route"},{"this","none","this"});
        set_verb_code(b,1,{"return 99;"});
        add_verb(b2,{player,"rxd","route"},{"this","none","this"});
        set_verb_code(b2,1,{"return 88;"});
        add_verb(p,{player,"rxd","route alias"},{"this","none","this"});
        set_verb_code(p,1,{"return 10;"});
        add_verb(p,{player,"rxd","other"},{"this","none","this"});
        set_verb_code(p,2,{"return 20;"});
        r = p;
        before = {r:route(), r:alias(), r:other(), `r:fresh() ! ANY'};
        set_verb_code(p, 1, {"return 11;"});
        return {before, {`r:route() ! ANY', `r:alias() ! ANY', `r:other() ! ANY', `r:fresh() ! ANY'}};
      finally
        recycle(c); recycle(p); recycle(b2); recycle(b);
      endtry
    expect:
      value: [[10,10,20,"E_VERBNF"],[11,11,20,"E_VERBNF"]]

