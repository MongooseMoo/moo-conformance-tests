name: fixture_provenance_pending_waif_recycle_shutdown
description: Rebuilds the recycle-shutdown fixture from its pinned Toast startup recipe.
server_db: RecipePendingWaifRecycleShutdown.db
requires:
  config: [managed_server, server_dir, server_db_dir]
tests:
  - name: recycle_recipe_output_matches_checked_in_fixture_bytes
    steps:
      - wait_for_server_exit: {timeout_ms: 5000, exit_code: 0}
      - assert_file:
          path: RecipePendingWaifRecycleShutdown.db.new
          equals_file: PendingWaifRecycleShutdown.db
          timeout_ms: 1000
