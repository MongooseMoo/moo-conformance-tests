  - name: mathfunc_log_subnormal
    code: "log(1e-310)"
    expect:
      value: -713.801378828154

  - name: mathfunc_log_smallest_subnormal
    code: "log(4.9e-324)"
    expect:
      value: -744.440071921381

  - name: mathfunc_log_negative_zero_pole
    code: "log(-0.0)"
    expect:
